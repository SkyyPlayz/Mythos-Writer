name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Runs first and populates the Actions npm cache (keyed on package-lock.json) so
  # the parallel downstream jobs get cache hits instead of each doing a cold
  # registry install on their fresh hosted VMs. (Replaces the SKY-4970 self-hosted
  # WSL2 serialization; hosted runners are ephemeral, so downstream jobs restore
  # the shared cache instead of relying on a warm local ~/.npm.)
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            electron-main/node_modules
            shared/node_modules
            ~/.cache/electron
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: source scripts/ci-retry.sh && retry npm ci
  paths-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-e2e: ${{ steps.filter-e2e.outputs.run-e2e }}
      docs-only: ${{ steps.filter-docs.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths — docs-only (path-based CI optimization)
        id: filter-docs
        uses: dorny/paths-filter@v2
        with:
          filters: |
            docs-only:
              - '**.md'
              - 'docs/**'
              - 'README*'
              - '.gitignore'
              - '.github/ISSUE_TEMPLATE/**'

      # SKY-8145: run-e2e's patterns are all-negated ("not a doc file"). With the
      # default predicate-quantifier ('some'/OR), a single negated pattern matches
      # almost any file, so this always evaluated true regardless of diff content —
      # the e2e-skip-on-docs-only feature this filter exists for never fired.
      # 'every' requires a changed file to satisfy ALL negations (i.e. actually not
      # be any doc type) before run-e2e goes true. Kept as a separate step because
      # predicate-quantifier applies to the whole paths-filter invocation, and
      # docs-only's positive OR patterns need the default 'some' quantifier.
      - name: Detect changed paths — run-e2e (path-based CI optimization)
        id: filter-e2e
        uses: dorny/paths-filter@v2
        with:
          predicate-quantifier: every
          filters: |
            run-e2e:
              - '!**.md'
              - '!docs/**'
              - '!README*'
              - '!.gitignore'
              - '!.github/ISSUE_TEMPLATE/**'

  lint:
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # SKY-1809: reject any tracked filename containing Windows-illegal characters
      # (\, <, >, :, ", |, ?, *) so build-windows can always check out the repo.
      - name: Guard — no Windows-illegal filenames in repo
        run: |
          if git ls-files | grep -Pq '[\\<>:"|?*]'; then
            echo 'ERROR: tracked filenames contain Windows-illegal characters (one of: \ < > : " | ? *):'
            git ls-files | grep -P '[\\<>:"|?*]'
            exit 1
          fi
          echo "Guard passed: no Windows-illegal filenames tracked."

      - name: Guard — all .github/workflows/*.yml files must parse as valid YAML (SKY-11200)
        run: python3 .github/scripts/check-workflow-yaml.py

      - name: Deinit stale git submodule registrations
        run: git submodule deinit --all -f 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            electron-main/node_modules
            shared/node_modules
            ~/.cache/electron
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: source scripts/ci-retry.sh && retry npm ci
      - name: Lint (frontend)
        run: npm run lint -w frontend

  typecheck:
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Deinit stale git submodule registrations
        run: git submodule deinit --all -f 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            electron-main/node_modules
            shared/node_modules
            ~/.cache/electron
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: source scripts/ci-retry.sh && retry npm ci
      - name: Type-check (frontend)
        run: npm run typecheck -w frontend

      - name: Type-check (electron-main)
        run: npm run typecheck -w electron-main

  unit:
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Deinit stale git submodule registrations
        run: git submodule deinit --all -f 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            electron-main/node_modules
            shared/node_modules
            ~/.cache/electron
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: source scripts/ci-retry.sh && retry npm ci
      - name: Resolve coverage flag
        id: coverage-flag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--coverage" >> "$GITHUB_OUTPUT"
          fi

      - name: Test (electron-main)
        run: npm run test -w electron-main -- ${{ steps.coverage-flag.outputs.flag }}

      - name: Test (frontend)
        run: npm run test -w frontend -- ${{ steps.coverage-flag.outputs.flag }}

      - name: Test (issue-finder dedupe key, SKY-8741)
        run: node .github/scripts/issue-finder.test.js

      - name: Upload coverage report
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            electron-main/coverage/
            frontend/coverage/
          retention-days: 3

  build-electron:
    # SKY-2425: fuzz steps removed from this job — they were causing OOM-induced
    # runner disconnects on the DOCX/EPUB step (step 8), which cancelled the whole
    # job and prevented all 4 e2e shards from running. Fuzz coverage is retained
    # via fuzz.yml (runs on every PR as a separate non-blocking check).
    # SKY-8081: flattened dependency chain — now only needs [setup] instead of
    # [lint, typecheck, unit], allowing this job to run in parallel with those
    # checks and reducing wall-clock latency from ~4 hops to ~3 hops.
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: WSL2 power keep-alive — prevent Windows host sleep
        # SKY-2427: GabesPC (WSL2 host) sleeps under default Windows power settings during
        # this ~90-min job. SetThreadExecutionState prevents sleep without admin rights.
        # Sentinel file ($TEMP/mythos-ci-keepalive.active) signals the background PS process
        # to exit cleanly. No-op on non-WSL2 runners.
        run: |
          if ! grep -qi microsoft /proc/version 2>/dev/null; then
            echo "Not WSL2 — sleep prevention skipped."; exit 0
          fi
          PS=/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
          if [ ! -x "$PS" ]; then
            echo "powershell.exe not accessible — sleep prevention skipped."; exit 0
          fi
          "$PS" -NonInteractive -ExecutionPolicy Bypass \
            -File "$(wslpath -w "$(pwd)/scripts/ci-power-keepalive.ps1")" &
          echo "WSL2 sleep prevention started."

      - name: Deinit stale git submodule registrations
        run: git submodule deinit --all -f 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            electron-main/node_modules
            shared/node_modules
            ~/.cache/electron
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: source scripts/ci-retry.sh && retry npm ci
      - name: Build (electron-vite)
        # SKY-4207: clean out/ before building — it is gitignored and persists across
        # runs on self-hosted runners; stale hashed renderer chunks accumulate and
        # inflated the artifact to 1.4 GB on run 28113426547.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          rm -rf out/
          npm run build:electron

      - name: Cache electron build for E2E shards
        # SKY-3872/SKY-4216: switched back to cache/save (separate 10 GB LRU quota)
        # after upload-artifact hit artifact storage quota on run 28113426547.
        # E2E shards fall back to a local rebuild on cache miss (SKY-3742).
        uses: actions/cache/save@v4
        with:
          path: out/
          key: electron-build-${{ github.run_id }}

      - name: Stop WSL2 power keep-alive
        if: always()
        run: |
          if ! grep -qi microsoft /proc/version 2>/dev/null; then exit 0; fi
          PS=/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
          [ -x "$PS" ] || exit 0
          "$PS" -NonInteractive -ExecutionPolicy Bypass \
            -File "$(wslpath -w "$(pwd)/scripts/ci-power-keepalive.ps1")" -Stop 2>/dev/null || true
          echo "WSL2 sleep prevention stopped."

  e2e-shard-1:
    # Shard 1: crud, brainstorm, visual-capture, writing-modes, depth-slider, a11y,
    # smoke, bg-scrim-slider, story-tab-subview, suggestions, tab-shell (SKY-6933 sweep)
    # split-pane-tab-strips (SKY-8907, rebalanced in from shard-4 by SKY-11045)
    # SKY-8090: skip if diff cannot affect these tests (e.g., docs-only changes)
    needs: [build-electron, paths-filter]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.paths-filter.outputs.run-e2e == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: WSL2 power keep-alive — prevent Windows host sleep
        # SKY-6906: GabesPC (WSL2 host) can sleep under default Windows power
        # settings during a ~15-20 min E2E shard, dropping the self-hosted
        # runner connection mid-job ("runner has received a shutdown signal").
        # build-electron already guards its own ~90-min job (SKY-2427); the
        # E2E shards need the same guard since they run just as long.
        run: |
          if ! grep -qi microsoft /proc/version 2>/dev/null; then
            echo "Not WSL2 — sleep prevention skipped."; exit 0
          fi
          PS=/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
          if [ ! -x "$PS" ]; then
            echo "powershell.exe not accessible — sleep prevention skipped."; exit 0
          fi
          "$PS" -NonInteractive -ExecutionPolicy Bypass \
            -File "$(wslpath -w "$(pwd)/scripts/ci-power-keepalive.ps1")" -Id shard1 &
          echo "WSL2 sleep prevention started."

      - name: Deinit stale git submodule registrations
        run: git submodule deinit --all -f 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            electron-main/node_modules
            shared/node_modules
            ~/.cache/electron
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: source scripts/ci-retry.sh && retry npm ci

      - name: Verify Electron binary (self-heal cache restore)
        # SKY-10092: a cache-hit can restore node_modules/electron without a
        # valid dist binary if the runner's network drops mid-extraction.
        # electron's own require() then lazily retries the download once with
        # no backoff and crashes the whole shard on a single blip. install.js
        # exits immediately if already installed, so this is a cheap no-op on
        # the common path and only pays the retry cost when repair is needed.
        run: source scripts/ci-retry.sh && retry node node_modules/electron/install.js
      - name: Restore electron build from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: out/
          key: electron-build-${{ github.run_id }}

      - name: Rebuild electron if cache miss
        # SKY-3742/SKY-3872: fallback rebuild when the cache key was evicted under
        # load. Avoids fail-on-cache-miss hard-fail while always supplying a build.
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: rm -rf out/ && npm run build:electron

      - name: Install Xvfb (virtual display for Electron E2E)
        run: |
          if command -v Xvfb >/dev/null 2>&1; then
            echo "Xvfb already installed — skipping apt-get (avoids sudo on self-hosted runner)"
          else
            sudo apt-get update -q
            sudo apt-get install -y xvfb
          fi

      - name: E2E — vault CRUD (headless)
        run: xvfb-run --auto-servernum npm run test:e2e:crud

      - name: E2E — Notes Vault folder operations (SKY-7995)
        run: xvfb-run --auto-servernum npm run test:e2e:folder-ops

      - name: E2E — Notes tree drag mechanics (SKY-8891)
        run: xvfb-run --auto-servernum npm run test:e2e:notes-drag

      - name: E2E — Notes vault seed-once with external content (SKY-9028)
        run: xvfb-run --auto-servernum npm run test:e2e:seed-once

      - name: E2E — draft version history snapshot and rollback (headless)
        run: xvfb-run --auto-servernum npm run test:e2e:draft-history

      - name: E2E — Brainstorm Agent streaming and vault note creation (headless)
        run: xvfb-run --auto-servernum npm run test:e2e:brainstorm

      - name: E2E — ExportDialog formats DOCX/EPUB/Markdown (SKY-2213)
        run: xvfb-run --auto-servernum npm run test:e2e:export

      - name: e2e visual-capture (MYT-531 §9.2/§9.3)
        run: xvfb-run --auto-servernum npm run test:e2e:visual-capture

      - name: Upload visual-capture artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: visual-capture-artifacts
          path: e2e-visual-artifacts/visual-capture/
          retention-days: 1

      - name: E2E — Writing modes UI keyboard switch + chrome shift (MYT-768)
        run: xvfb-run --auto-servernum npm run test:e2e:writing-modes

      - name: E2E — Depth slider + scene navigator (SKY-2441)
        run: xvfb-run --auto-servernum npm run test:e2e:depth-slider

      - name: E2E — A11y tab-focus audit VaultBrowser (SKY-143)
        run: xvfb-run --auto-servernum npm run test:e2e:a11y

      - name: E2E — Settings background image persistence (SKY-3219)
        run: xvfb-run --auto-servernum npm run test:e2e:settings-background

      - name: E2E — Smoke test app launch (SKY-6933 sweep)
        run: xvfb-run --auto-servernum npm run test:e2e:smoke

      - name: E2E — Background scrim opacity slider (SKY-3220, SKY-6933 sweep)
        run: xvfb-run --auto-servernum npm run test:e2e:bg-scrim-slider

      - name: E2E — Story tab subview (SKY-6933 sweep)
        run: xvfb-run --auto-servernum npm run test:e2e:story-tab-subview

      - name: E2E — Writing suggestions panel (SKY-6933 sweep)
        run: xvfb-run --auto-servernum npm run test:e2e:suggestions

      - name: E2E — Tab shell (SKY-6933 sweep)
        run: xvfb-run --auto-servernum npm run test:e2e:tab-shell

      - name: E2E — Local model picker (SKY-6933 sweep)
        run: xvfb-run --auto-servernum npm run test:e2e:lmp

      - name: E2E — Cloud sync (SKY-6933 sweep, skip-guarded — deferred feature)
        run: xvfb-run --auto-servernum npm run test:e2e:cloud-sync

      - name: E2E — Continuity peek (SKY-8242 un-skipped, was flaky full-sequential-run)
        run: xvfb-run --auto-servernum npm run test:e2e:continuity-peek

      - name: E2E — Accessibility fixes SKY-1362 (SKY-6933 sweep, skip-guarded — stale selector)
        run: xvfb-run --auto-servernum npm run test:e2e:accessibility-fixes-sky1362

      - name: E2E — Beta read (SKY-6933 sweep, skip-guarded — stale selector)
        run: xvfb-run --auto-servernum npm run test:e2e:beta-read

      - name: E2E — Split-pane per-pane tab strips (SKY-8907)
        # SKY-11045: rebalanced off shard-4 (was ~2x shards 1-3 in step count
        # and wall-clock — see PR description for measurements)
        run: xvfb-run --auto-servernum npm run test:e2e:split-pane-tab-strips

      - name: Upload E2E report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-shard-1
          path: e2e-report/
          retention-days: 3

      - name: Stop WSL2 power keep-alive
        if: always()
        run: |
          if ! grep -qi microsoft /proc/version 2>/dev/null; then exit 0; fi
          PS=/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
          [ -x "$PS" ] || exit 0
          "$PS" -NonInteractive -ExecutionPolicy Bypass \
            -File "$(wslpath -w "$(pwd)/scripts/ci-power-keepalive.ps1")" -Id shard1 -Stop 2>/dev/null || true
          echo "WSL2 sleep prevention stopped."

  e2e-shard-2:
    # Shard 2: writing-assistant-tips, two-vault, notes-vault-registry (SKY-11058), story-vault-registry (SKY-11150), versioned-drafts, entity, title-bar-undo-redo, mythos-migration
    # two-vault-firstrun, notes-tab, archive-agent-mvp, editor-page-chrome, coach-page (SKY-6933 sweep)
    # agent-hub-session-picker (SKY-8537, #1130 — added by SKY-8749 audit, was never wired into CI)
    # notes-split-pane-tab-strips (SKY-9784, rebalanced in from shard-4 by SKY-11045)
    # SKY-8090: skip if diff cannot affect these tests (e.g., docs-only changes)
    needs: [build-electron, paths-filter]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.paths-filter.outputs.run-e2e == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: WSL2 power keep-alive — prevent Windows host sleep
        # SKY-6906: see e2e-shard-1 for rationale.
        run: |
          if ! grep -qi microsoft /proc/version 2>/dev/null; then
            echo "Not WSL2 — sleep prevention skipped."; exit 0
          fi
          PS=/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
          if [ ! -x "$PS" ]; then
            echo "powershell.exe not accessible — sleep prevention skipped."; exit 0
          fi
          "$PS" -NonInteractive -ExecutionPolicy Bypass \
            -File "$(wslpath -w "$(pwd)/scripts/ci-power-keepalive.ps1")" -Id shard2 &
          echo "WSL2 sleep prevention started."

      - name: Deinit stale git submodule registrations
        run: git submodule deinit --all -f 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            electron-main/node_modules
            shared/node_modules
            ~/.cache/electron
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: source scripts/ci-retry.sh && retry npm ci

      - name: Verify Electron binary (self-heal cache restore)
        # SKY-10092: a cache-hit can restore node_modules/electron without a
        # valid dist binary if the runner's network drops mid-extraction.
        # electron's own require() then lazily retries the download once with
        # no backoff and crashes the whole shard on a single blip. install.js
        # exits immediately if already installed, so this is a cheap no-op on
        # the common path and only pays the retry cost when repair is needed.
        run: source scripts/ci-retry.sh && retry node node_modules/electron/install.js
      - name: Restore electron build from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: out/
          key: electron-build-${{ github.run_id }}

      - name: Rebuild electron if cache miss
        # SKY-3742/SKY-3872: fallback rebuild when the cache key was evicted under
        # load. Avoids fail-on-cache-miss hard-fail while always supplying a build.
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: rm -rf out/ && npm run build:electron

      - name: Install Xvfb (virtual display for Electron E2E)
        run: |
          if command -v Xvfb >/dev/null 2>&1; then
            echo "Xvfb already installed — skipping apt-get (avoids sudo on self-hosted runner)"
          else
            sudo apt-get update -q
            sudo apt-get install -y xvfb
          fi

      - name: E2E — Writing Assistant tip card panel scan + note/ignore (SKY-1618)
        run: xvfb-run --auto-servernum npm run test:e2e:writing-assistant-tips

      - name: E2E — Two-vault layout Story + Notes CRUD (MYT-769)
        run: xvfb-run --auto-servernum npm run test:e2e:two-vault

      - name: "E2E — Obsidian import fidelity, real IPC + disk (SKY-8005/SKY-8445)"
        run: xvfb-run --auto-servernum npm run test:e2e:obsidian-import-fidelity

      # SKY-11058 reachability: fresh profile → create a second notes vault via
      # the picker → swap active → link-resolution report → relaunch → still
      # active. The second vault is user-created through the real UI, never
      # pre-seeded (§4c).
      - name: E2E — Notes-vault registry picker reachability (SKY-11058)
        run: xvfb-run --auto-servernum npm run test:e2e:notes-vault-registry

      # SKY-11150: story-vault registry across the renderer↔main IPC boundary —
      # fresh profile, story-vaults.json NOT pre-seeded (lazy migration on first
      # open), then create → pair → restart-persistence. Drives the preload API
      # directly because the story-vault *picker UI* is a separate follow-up
      # (see SKY-11150 report); the registry substrate itself is exercised
      # end-to-end, never pre-seeded (§4c).
      - name: E2E — Story-vault registry migrate/create/pair/restart (SKY-11150)
        run: xvfb-run --auto-servernum npm run test:e2e:story-vault-registry

