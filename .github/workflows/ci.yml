  ci:
    # Required check aggregator — always runs (if: always()) so branch protection
    # gets a definitive pass/fail rather than a "pending" indefinite skipped state
    # when Stage 1 (lint/typecheck/unit) fails and downstream jobs are skipped.
    # Explicit outcome check ensures any failure or skip in upstream jobs → failure here.
    # SKY-8090: e2e shards may be legitimately skipped if the diff cannot affect them
    # (e.g., docs-only changes). Accept 'skipped' as valid for e2e shards only.
    needs: [lint, typecheck, unit, paths-filter, e2e-shard-1, e2e-shard-2, e2e-shard-3, e2e-shard-4]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5

    steps:
      - name: All checks passed
        run: |
          # Stage 1 checks must always succeed
          stage1="${{ needs.lint.result }} ${{ needs.typecheck.result }} ${{ needs.unit.result }}"
          echo "Stage 1 (lint/typecheck/unit) results: $stage1"
          for r in $stage1; do
            if [ "$r" != "success" ]; then
              echo "ERROR: Required Stage 1 job outcome '$r' — expected 'success'. CI aggregator: FAILED."
              exit 1
            fi
          done

          # E2E shards may be legitimately skipped if path-filter determined they cannot be affected
          e2e="${{ needs.e2e-shard-1.result }} ${{ needs.e2e-shard-2.result }} ${{ needs.e2e-shard-3.result }} ${{ needs.e2e-shard-4.result }}"
          echo "E2E shard results: $e2e"
          for r in $e2e; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "ERROR: E2E shard outcome '$r' — expected 'success' or 'skipped'. CI aggregator: FAILED."
              exit 1
            fi
          done

          # Validate that at least one e2e shard ran if path-filter said to run e2e
          run_e2e="${{ needs.paths-filter.outputs.run-e2e }}"
          if [ "$run_e2e" = "true" ]; then
            skipped_count=0
            for r in $e2e; do
              [ "$r" = "skipped" ] && skipped_count=$((skipped_count + 1))
            done
            if [ "$skipped_count" -eq 4 ]; then
              echo "ERROR: path-filter indicated e2e should run, but all 4 shards were skipped. CI aggregator: FAILED."
              exit 1
            fi
          fi

          echo "All checks passed — lint, typecheck, unit, and applicable E2E shards are green."

  build-linux:
    # SKY-8081: moved PR guard from step-level to job-level so PRs don't allocate
    # runners. Report job was the only downstream consumer (now deleted), so the
    # skipped status issue from SKY-2421 no longer applies. Packaging steps still
    # guard at step level as a safety redundancy.
    if: github.event_name != 'pull_request'
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: build-linux-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'

      - name: WSL2 power keep-alive — prevent Windows host sleep
        # SKY-2427: same sleep-prevention guard as the ci job (40-min build also at risk).
        run: |
          if ! grep -qi microsoft /proc/version 2>/dev/null; then
            echo "Not WSL2 — sleep prevention skipped."; exit 0
          fi
          PS=/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
          if [ ! -x "$PS" ]; then
            echo "powershell.exe not accessible — sleep prevention skipped."; exit 0
          fi
          "$PS" -NonInteractive -ExecutionPolicy Bypass \
            -File "$(wslpath -w "$(pwd)/scripts/ci-power-keepalive.ps1")" &
          echo "WSL2 sleep prevention started."

      - name: Pre-flight — clean stale AppImage temp dirs (SKY-1347)
        # APPIMAGE_EXTRACT_AND_RUN=1 in the smoke-test step leaves /tmp/appimage_extracted_*
        # dirs (~307 MB each) that accumulate across CI runs on the self-hosted runner and
        # fill the 24 GB tmpfs, causing fpm ENOSPC during deb packaging. This sweep reclaims
        # space from any prior run's leftovers before we start the build.
        if: github.event_name != 'pull_request'
        run: find /tmp -maxdepth 1 -name 'appimage_extracted_*' -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Deinit stale git submodule registrations
        run: git submodule deinit --all -f 2>/dev/null || true

      - name: Set up Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # SKY-10092: build-linux previously ran `npm ci` fresh every push with no
      # node_modules/electron-binary cache, so every run re-downloaded the Electron
      # zip from the network — a single "socket hang up" failed the whole job. This
      # reuses the same cache key as the ubuntu-latest lint/typecheck/unit jobs, so
      # a same-run cache warmed earlier in the workflow is picked up here too.
      - name: Cache node_modules
        if: github.event_name != 'pull_request'
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            electron-main/node_modules
            shared/node_modules
            ~/.cache/electron
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: github.event_name != 'pull_request' && steps.nm-cache.outputs.cache-hit != 'true'
        run: source scripts/ci-retry.sh && retry npm ci

      # SKY-10092: electron-builder downloads its own packaging toolchain
      # (AppImage/7zip helpers) separately from the Electron app binary above —
      # this is the other download surface behind the "socket hang up" failures.
      # Cached independently since it's untouched by the node_modules cache key.
      - name: Cache electron-builder toolchain
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Guard — PERSIST_PROMPTS must not be set for release builds
        if: github.event_name != 'pull_request'
        run: |
          if [ "${PERSIST_PROMPTS:-}" = "1" ]; then
            echo "ERROR: PERSIST_PROMPTS=1 is set in the environment. This flag stores full prompt text in cleartext and must never be enabled in a release build. Unset it before packaging." >&2
            exit 1
          fi
          for env_file in .env .env.production .env.local; do
            if [ -f "$env_file" ] && grep -qE '^PERSIST_PROMPTS=1' "$env_file"; then
              echo "ERROR: PERSIST_PROMPTS=1 found in $env_file. This flag stores full prompt text in cleartext and must never be included in a release build. Remove or comment it out before packaging." >&2
              exit 1
            fi
          done
          echo "Guard passed: PERSIST_PROMPTS is not set."

      - name: Free disk space before packaging
        # SKY-1334: runner accumulates linux-unpacked staging dirs and /tmp electron-builder
        # scratch trees from prior runs; purge them before the deb/AppImage build to avoid ENOSPC.
        if: github.event_name != 'pull_request'
        run: |
          echo "=== Disk before cleanup ===" && df -h .
          find ~/.cache/electron-builder -mindepth 2 -maxdepth 3 \
            \( -name 'linux-unpacked' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec rm -rf {} + 2>/dev/null || true
          find /tmp -maxdepth 1 -name 'electron-builder-*' -type d -exec rm -rf {} + 2>/dev/null || true
          echo "=== Disk after cleanup ===" && df -h .

      - name: Build and package (Linux AppImage + deb)
        # deb packaging is in electron-builder.json for release builds; CI validates AppImage + deb.
        # Skip rpm target: rpmbuild and fpm not fully provisioned on GabesPC yet.
        # Clear LD_LIBRARY_PATH so the runner's inherited Paperclip embedded-postgres lib path
        # does not shadow the system liblzma.so.5 and break xz/tar/dpkg-deb during packaging.
        if: github.event_name != 'pull_request'
        env:
          LD_LIBRARY_PATH: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build:electron && source scripts/ci-retry.sh && retry npx electron-builder --linux AppImage deb --publish never

      - name: Verify .deb artifact
        # dpkg-deb also loads liblzma, so clear LD_LIBRARY_PATH here too.
        if: github.event_name != 'pull_request'
        env:
          LD_LIBRARY_PATH: ""
        run: |
          DEB=$(ls dist-electron/*.deb | head -1)
          echo "Verifying .deb: $DEB"
          dpkg-deb --info "$DEB"

      - name: Install Xvfb (virtual display for AppImage smoke test)
        if: github.event_name != 'pull_request'
        run: |
          if command -v Xvfb >/dev/null 2>&1; then
            echo "Xvfb already installed — skipping apt-get"
          else
            sudo apt-get update -q
            sudo apt-get install -y xvfb
          fi

      - name: Smoke-test AppImage (start / stop)
        # APPIMAGE_EXTRACT_AND_RUN=1 extracts to a temp dir instead of mounting via
        # FUSE, so libfuse2 does not need to be installed on the runner.
        if: github.event_name != 'pull_request'
        run: |
          APPIMAGE=$(ls dist-electron/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run --auto-servernum "$APPIMAGE" --no-sandbox &
          APP_PID=$!
          sleep 8
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "AppImage exited prematurely — smoke test FAILED"
            exit 1
          fi
          kill "$APP_PID"
          wait "$APP_PID" || true
          echo "Smoke test passed: AppImage started and stopped cleanly"

      - name: Clean AppImage temp dirs after smoke test
        # Remove the extracted AppImage dir created by APPIMAGE_EXTRACT_AND_RUN=1.
        # Runs even on failure so partial extractions don't accumulate.
        if: always() && github.event_name != 'pull_request'
        run: find /tmp -maxdepth 1 -name 'appimage_extracted_*' -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Upload Linux packages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
          retention-days: 3

      - name: Stop WSL2 power keep-alive
        if: always()
        run: |
          if ! grep -qi microsoft /proc/version 2>/dev/null; then exit 0; fi
          PS=/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
          [ -x "$PS" ] || exit 0
          "$PS" -NonInteractive -ExecutionPolicy Bypass \
            -File "$(wslpath -w "$(pwd)/scripts/ci-power-keepalive.ps1")" -Stop 2>/dev/null || true
          echo "WSL2 sleep prevention stopped."

  build-windows:
    # SKY-8081: moved PR guard from step-level to job-level so PRs don't allocate
    # runners. Report job was the only downstream consumer (now deleted), so the
    # skipped status issue from SKY-2421 no longer applies. Packaging steps still
    # guard at step level as a safety redundancy.
    # SKY-7428: native windows-latest runner (was ubuntu-latest cross-building via
    # wine, which broke — "wine is required" — after the hosted-runner migration).
    # The windows-latest quota failure seen on PR #571 was a private-repo minutes
    # limit; the repo is now public (35507aea), so hosted Windows minutes are free
    # and native packaging is simpler and more reliable than a wine cross-build.
    if: github.event_name != 'pull_request'
    needs: [setup]
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'

      - name: Deinit stale git submodule registrations
        run: git submodule deinit --all -f 2>/dev/null || true

      - name: Set up Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # SKY-10092: same rationale as build-linux — cache the Electron app binary
      # and electron-builder's own toolchain download so a network blip doesn't
      # redownload ~150MB+ per push. Windows default cache locations per
      # env-paths/electron-builder's getCacheDirectory() are under %LOCALAPPDATA%.
      - name: Cache node_modules
        if: github.event_name != 'pull_request'
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            electron-main/node_modules
            shared/node_modules
            ~/AppData/Local/electron/Cache
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Cache electron-builder toolchain
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: github.event_name != 'pull_request' && steps.nm-cache.outputs.cache-hit != 'true'
        run: source scripts/ci-retry.sh && retry npm ci
      # SKY-3191: whisper.cpp/Piper spawn (voice.ts) and the MYT-788 trusted-set
      # gate (voiceGate.ts) have no platform-conditional branches — they rely
      # entirely on Node's cross-platform child_process.spawn/fs.realpathSync —
      # but the `unit` job only ever runs on ubuntu-latest, so that claim had
      # never been empirically checked on native Windows. Scoped to the voice
      # suite (not the full unit run) to keep this native-Windows job fast.
      - name: Verify voice spawn/gate suite on native Windows (SKY-3191)
        if: github.event_name != 'pull_request'
        run: npm run test -w electron-main -- voice

      # SKY-8881: listVaultFiles built listing paths with path.join, which
      # emits '\' on native Windows — the renderer's '/'-based path handling
      # then re-created source folders on every nested move ("it just
      # duplicates the folders"). The vault suite asserts POSIX listing paths
      # and only exercises the Windows code path here — the ubuntu `unit` job
      # cannot fail on this by construction.
      - name: Verify vault suite on native Windows (SKY-8881)
        if: github.event_name != 'pull_request'
        run: npm run test -w electron-main -- vault.test

      - name: Build (electron-vite)
        if: github.event_name != 'pull_request'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build:electron

      # SKY-8881: real renderer→IPC→fs folder-ops E2E on native Windows.
      # FO-07..FO-10 drag NESTED items, the exact case the separator bug
      # broke for the owner; a Linux-only E2E run is blind to it because
      # path.join emits '/' there. windows-latest has a desktop session, so
      # Electron launches headed without xvfb.
      - name: Folder-ops E2E on native Windows (SKY-8881)
        if: github.event_name != 'pull_request'
        run: npm run test:e2e:folder-ops

      # SKY-8891: the drag suite persists tree order as POSIX paths in
      # .vb-order.json — DR-02's exact-string assertions only catch a
      # separator regression where path.join actually emits '\'.
      - name: Notes-tree drag E2E on native Windows (SKY-8891)
        if: github.event_name != 'pull_request'
        run: npm run test:e2e:notes-drag

      - name: Package (Windows NSIS + ZIP)
        if: github.event_name != 'pull_request'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: source scripts/ci-retry.sh && retry npx electron-builder --win nsis zip --publish never

      - name: Upload Windows packages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
          retention-days: 3

  # SKY-9027: scoped, PR-gating native-Windows check for the notes/folder
  # Unicode-name-handling surface (R3 — emoji/full-Unicode note and folder
  # names). Deliberately a separate job from build-windows above: that job
  # is PR-skipped and continue-on-error by design (SKY-8081/SKY-7428 — it
  # exists to produce release packages, not to gate merges), so it cannot
  # catch a Windows-only path-separator regression before merge. This job
  # runs only the notes name-handling suites (no packaging), so it stays
  # fast enough to require on every PR. `.github/` change — merge path is
  # ESCALATE-IVY per COMPANY-STANDARDS §3.
  notes-windows:
    needs: [setup]
    runs-on: windows-latest
    # SKY-10910: raised from 20 — this job grew 5 more native-Windows Electron
    # launches (vault delete/migration/quit-teardown x4 lifecycle specs) to
    # close the Windows CI vault-lifecycle gap.
    # SKY-11058: raised from 35 — one more launch (notes-vault swap
    # handle-release spec).
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Deinit stale git submodule registrations
        run: git submodule deinit --all -f 2>/dev/null || true

      # SKY-10895: real-time Windows Defender scanning of freshly-written
      # files is a documented source of transient EPERM/EBUSY on this
      # runner's TEMP dir (where every e2e spec's mkdtempSync fixtures live),
      # independent of anything our own code holds open. This is
      # defense-in-depth alongside the app-level retry + copy/delete fallback
      # in vaultGuidedMove.ts, not a substitute for it.
      - name: Exclude runner TEMP from Windows Defender real-time scanning (SKY-10895)
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:TEMP"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: source scripts/ci-retry.sh && retry npm ci
      # Unicode-preserving sanitizer + slug/collision helpers — pure logic,
      # but Windows-reserved-device-name and trailing-dot/space rules are
      # exactly the platform-specific part worth re-checking natively.
      - name: Unit — notes vault name sanitizer suite (SKY-9027)
        run: npm run test -w electron-main -- vaultNameSanitizer vault.test

      - name: Build (electron-vite)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build:electron

      # Create/rename/open/wikilink-to/display an emoji-named note and folder,
      # end to end through the real renderer→IPC→fs path on native Windows.
      - name: E2E — Unicode/emoji note and folder names on native Windows (SKY-9027)
        run: npm run test:e2e:notes-unicode-names

      # SKY-8881 regression guard: nested-item nested drag/rename POSIX-path
      # assertions. Re-run here (not just in build-windows) so a regression
      # in this surface actually blocks the PR instead of only being visible
      # after merge on the non-PR, continue-on-error build-windows job.
      # SKY-10910: this is also the native-Windows "vault rename" gap-2
      # coverage — FO-13 renames a nested note in place through the real
      # renderer→IPC→fs path with the Notes Vault watcher + DB bound to the
      # source, on native Windows. FO-05/FO-06 (folder rename/delete) are
      # currently test.fixme'd on win32 — SKY-10910 discovered a real
      # Windows-only bug (context-menu rename retargets to an expanded
      # folder's child row instead of the folder), tracked as SKY-10935.
      - name: E2E — Notes Vault folder operations on native Windows (SKY-8881, SKY-10910 gap 2)
        run: npm run test:e2e:folder-ops

      # SKY-10895 regression guard: Move Vault wizard's default local-folder
      # path (the owner's exact repro — "Settings → Move to a different
      # folder") through the real vault:localFolderMove IPC handler, with the
      # app's own Story Vault watcher + DB bound to the source, on native
      # Windows. Windows refuses to rename a directory with open handles
      # inside it (EPERM); POSIX (build-linux/build-macos/ci) does not, so
      # this defect is invisible everywhere except here.
      - name: E2E — Move Vault wizard releases handles before rename on native Windows (SKY-10895)
        run: npx playwright test e2e/move-vault-local-real.spec.ts --reporter=list

      # SKY-10910 gap 5: the cloud-sync guided-move path (move-vault-real.spec.ts)
      # was previously POSIX-only — it satisfies checkGuidedMoveGate's
      # homedir-containment check by overriding $HOME, which native Windows
      # (os.homedir() reads USERPROFILE, not HOME) silently ignored. The spec
      # now branches its home-override env var by platform so this runs for
      # real here too.
      - name: E2E — Move Vault wizard cloud-sync guided move on native Windows (SKY-10910 gap 5)
        run: npx playwright test e2e/move-vault-real.spec.ts --reporter=list

      # SKY-11058: swapping the active notes vault re-points the chokidar
      # watcher + DB handles from the old vault dir to the new one. Windows
      # refuses to rename a directory with open handles (EPERM); POSIX does
      # not — so a handle leak on swap is invisible on every Linux job. This
      # swaps while a note from the original vault is open, then proves the
      # original dir can be renamed (handles released, SKY-10895 pattern).
      - name: E2E — Notes-vault swap releases old-vault handles on native Windows (SKY-11058)
        run: npx playwright test e2e/notes-vault-swap-windows-real.spec.ts --reporter=list

      # SKY-10910 gap 1: SKY-8882 ("old vault not deleted on Windows") was
      # independently closed as fixed three separate times on Linux-only E2E.
      # Real Settings → Danger zone → Clear all data → uninstallHelper delete
      # path, asserting the vault directory is actually gone from disk (not
      # just DB-marked) on native Windows.
      - name: E2E — Delete Everything removes the vault from disk on native Windows (SKY-10910 gap 1)
        run: npm run test:e2e:windows-vault-delete-lifecycle

      # SKY-10910 gap 3: the v0.4 → MythosVault v2 boot migration
      # (mythosMigrationStatus / MythosMigrationCenter.tsx path) copies a full
      # vault tree into a sibling folder and repoints settings — real
      # directory/file-handle work with no prior native-Windows E2E coverage.
      - name: E2E — Silent boot migration on native Windows (SKY-10910 gap 3)
        run: npm run test:e2e:windows-vault-migration-lifecycle

      # SKY-10910 gap 4: SKY-10902 fixed "app can't be closed" with bounded
      # per-step teardown timeouts, but quitTeardown.test.ts only proves that
      # contract with MOCKED timers, which cannot catch a real hang. This
      # drives real move/delete/rename/migration ops on native Windows, then
      # asserts the actual Electron process exits within a bounded time.
      - name: E2E — App quits within bounded time after real vault ops on native Windows (SKY-10902, SKY-10910 gap 4)
        run: npm run test:e2e:windows-quit-teardown

      # SKY-11132 (owner data-safety bug): Open Vault Folder used to accept
      # any OS-dialog folder unconditionally and repoint the Story Vault at
      # it, seeding app files into whatever was picked — including the
      # owner's real, cloud-synced Obsidian vault. checkOpenFolderGate
      # (vaultGate.ts) now refuses that; this proves the source folder's
      # contents and mtimes survive a refused open-folder attempt on native
      # Windows, where path/mtime semantics differ from the POSIX runners
      # this class of bug is otherwise invisible on.
      - name: E2E — Open Vault Folder refuses a foreign non-empty folder, source untouched, on native Windows (SKY-11132)
        run: npm run test:e2e:vault-open-folder-guard

      - name: Upload E2E report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: notes-windows-e2e-report
          # The e2e npm scripts pass --reporter=list, which replaces the html
          # reporter from playwright.config — e2e-report/ is never written
          # here. Failure screenshots and error-context land in test-results/.
          path: |
            e2e-report/
            test-results/
          retention-days: 3
