# SPEC / land on carve-out PR #1619 (Skyy voice 2026-09-25)
# Draft gate + draft-CI comment-only. No update-branch call: the step's `if`
# read steps.gate.outputs.prs, and kept PR numbers were never written there.
# Creed: cut waste, don't weaken quality.
#
# Repo vars (optional):
#   MYTHOS_TIP_FIX_WINDOW_MINUTES — default 20; audit may write 10 when gate avg >1.5 for 2 consecutive audits
#   MYTHOS_WAKE_CIRCUIT_BREAKER — ISO timestamp until which Grok Bot PR-watch must stay SILENT on draft pr-pushed / CI-fail fan-out (48h spike cap)
#
# Labels:
#   tip-freeze — gate SKIPS these PRs (never churn tip SHA mid-gate)
#   do-not-merge — gate SKIPS these PRs
#
# Autofix shadow / coordination: docs/MYTHOS_AUTOFIX.md
#   MYTHOS_AUTOFIX_MODE, MYTHOS_AUTOFIX_SHADOW_UNTIL
# Priority: circuit-breaker > trend-throttle
#
# Main-push workflow_run has no associated PRs. GET .../pull_requests is HTTP 404
# and `gh api` still prints the error JSON on stdout. Resolve via
# scripts/mythos-ops/ops-guards.sh (soft skip exit 0). Never pass non-numeric
# tokens to `gh pr view`.

name: Mythos PR hygiene

on:
  schedule:
    # Hourly soft sweep for behind-main drafts / open PRs (cheap; no agent turns)
    - cron: "17 * * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "rebase | draft-ci | both"
        required: false
        default: "both"

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  checks: read

concurrency:
  group: mythos-pr-hygiene-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-rebase:
    name: auto-rebase
    if: >
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'rebase' || github.event.inputs.mode == 'both' || github.event.inputs.mode == '')) ||
      (github.event_name == 'pull_request' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Skip tip-freeze labeled PRs
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/mythos-ops/ops-guards.sh"
          # Collect candidate PR numbers; the loop keeps drafts only.
          CANDS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CANDS="${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # 404 on main push is a soft skip — do not capture the error JSON.
            RUN_ID="${{ github.event.workflow_run.id }}"
            if ! CANDS=$(resolve_run_prs "$RUN_ID"); then
              echo "no pull_requests for run ${RUN_ID} (main push / 404) — soft skip"
              CANDS=""
            fi
            CANDS=$(printf '%s' "$CANDS" | tr '\n' ' ')
          else
            # schedule / dispatch: open PRs behind base (loop keeps drafts only)
            CANDS=$(gh pr list --repo "${{ github.repository }}" --state open --limit 40 \
              --json number,isDraft,labels,mergeStateStatus \
              --jq '.[] | select(.mergeStateStatus=="BEHIND" or .mergeStateStatus=="DIRTY") | .number' | tr '\n' ' ' || true)
          fi
          KEEP=""
          for n in $CANDS; do
            case "$n" in
              ''|*[!0-9]*) echo "skip non-numeric token: $n"; continue ;;
            esac
            META=$(gh pr view "$n" --repo "${{ github.repository }}" --json isDraft,labels --jq '{draft:.isDraft,labels:([.labels[].name]|join(","))}')
            DRAFT=$(jq -r '.draft' <<<"$META")
            LABELS=$(jq -r '.labels' <<<"$META")
            if [ "$DRAFT" != "true" ]; then
              echo "skip #$n non-draft"
              continue
            fi
            case ",$LABELS," in
              *,tip-freeze,*) echo "skip #$n tip-freeze"; continue ;;
              *,do-not-merge,*) echo "skip #$n do-not-merge"; continue ;;
            esac
            KEEP="$KEEP $n"
          done
          # Log kept draft numbers. Nothing reads a step output.
          echo "$KEEP" | xargs -n1 2>/dev/null || true

  draft-ci-comment:
    name: draft-ci-comment
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'draft-ci' || github.event.inputs.mode == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Comment-only on draft CI failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/mythos-ops/ops-guards.sh"
          # Resolve PR(s) for the failed CI run. Main push → 404 → soft skip.
          RUN_ID="${{ github.event.workflow_run.id }}"
          if [ -z "${RUN_ID:-}" ]; then
            echo "no workflow_run id — soft skip"
            exit 0
          fi
          if ! PRS=$(resolve_run_prs "$RUN_ID"); then
            echo "no pull_requests for run ${RUN_ID} (main push / 404) — soft skip"
            exit 0
          fi
          if [ -z "$(printf '%s' "$PRS" | tr -d '[:space:]')" ]; then
            exit 0
          fi
          for n in $PRS; do
            case "$n" in
              ''|*[!0-9]*) echo "skip non-numeric token: $n"; continue ;;
            esac
            DRAFT=$(gh pr view "$n" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)
            if [ "$DRAFT" != "true" ]; then
              echo "skip #$n not draft"
              continue
            fi
            # Dedupe: one sticky comment marker per head SHA
            HEAD=$(gh pr view "$n" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)
            # LIGHT-GREEN: this ci run is the light set and the PR is still a draft at
            # that head. Unreadable jobs or draft state are not light, so the sticky
            # still posts. No PR title or body is read here.
            CLASS="NOT-LIGHT"
            JOBS_JSON="$(mktemp)"
            COMBINED="$(mktemp)"
            if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
              RUN_PATH="$(jq -r '.workflow_run.path // empty' "$GITHUB_EVENT_PATH")"
              RUN_SHA="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
              if gh api --paginate --jq '.jobs[]' "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs?per_page=100" | jq -s '.' > "$JOBS_JSON"; then
                RUN_KEY="$(printf '%s_%s' workflow run)"
                if jq -n \
                  --arg key "$RUN_KEY" \
                  --arg path "$RUN_PATH" \
                  --arg head "$RUN_SHA" \
                  --arg prhead "$HEAD" \
                  --argjson draft "$DRAFT" \
                  --slurpfile jobs "$JOBS_JSON" \
                  '{($key):{path:$path, head_sha:$head}, jobs:$jobs[0], pull_request:{draft:$draft, head_sha:$prhead}}' \
                  > "$COMBINED"; then
                  CLASS="$(bash "${GITHUB_WORKSPACE}/.github/scripts/is-light-run.sh" "$COMBINED" || true)"
                fi
              fi
            fi
            rm -f "$JOBS_JSON" "$COMBINED"
            if [ "$CLASS" = "LIGHT-GREEN" ]; then
              echo "skip #$n LIGHT-GREEN"
              continue
            fi
            MARKER="<!-- mythos-draft-ci:${HEAD} -->"
            EXISTING=$(gh api "repos/${{ github.repository }}/issues/$n/comments" --paginate \
              --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1 || true)
            FAIL_JOBS=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json jobs \
              --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")' || echo "unknown")
            BODY=$(printf '%s\n**Draft CI failed** on tip `%s`.\nFailed jobs: %s\nRun: %s/%s/actions/runs/%s\n\nStanding agent: one CI-FIX batch per FORGE_E2E_KEEPALIVE.md + FORGE_TIP_FREEZE.md (docs paths only — do not paste full contracts). Tip-fix window: vars.MYTHOS_TIP_FIX_WINDOW_MINUTES (default 20; may auto-drop to 10).\n' \
              "$MARKER" "$HEAD" "$FAIL_JOBS" "${{ github.server_url }}" "${{ github.repository }}" "$RUN_ID")
            if [ -n "$EXISTING" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
              echo "updated comment on #$n"
            else
              gh pr comment "$n" --repo "${{ github.repository }}" --body "$BODY"
              echo "created comment on #$n"
            fi
          done

# draft-ready-on-green was removed. No job in this workflow marks a PR ready.
