# SPEC / land on carve-out PR #1619 (Skyy voice 2026-09-25)
# Merged: auto-rebase + draft-CI comment-only (one workflow, two jobs).
# Creed: cut waste, don't weaken quality.
#
# Repo vars (optional):
#   MYTHOS_TIP_FIX_WINDOW_MINUTES — default 20; audit may write 10 when gate avg >1.5 for 2 consecutive audits
#   MYTHOS_WAKE_CIRCUIT_BREAKER — ISO timestamp until which Grok Bot PR-watch must stay SILENT on draft pr-pushed / CI-fail fan-out (48h spike cap)
#
# Labels:
#   tip-freeze — auto-rebase SKIPS these PRs (never churn tip SHA mid-gate)
#
# Autofix shadow / coordination: docs/MYTHOS_AUTOFIX.md
#   MYTHOS_AUTOFIX_MODE, MYTHOS_AUTOFIX_SHADOW_UNTIL
# Priority: circuit-breaker > trend-throttle > auto ready-for-review
#
# Main-push workflow_run has no associated PRs. GET .../pull_requests is HTTP 404
# and `gh api` still prints the error JSON on stdout. Resolve via
# scripts/mythos-ops/ops-guards.sh (soft skip exit 0). Never pass non-numeric
# tokens to `gh pr view`.

name: Mythos PR hygiene

on:
  schedule:
    # Hourly soft sweep for behind-main drafts / open PRs (cheap; no agent turns)
    - cron: "17 * * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "rebase | draft-ci | both"
        required: false
        default: "both"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read

concurrency:
  group: mythos-pr-hygiene-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-rebase:
    name: auto-rebase
    if: >
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'rebase' || github.event.inputs.mode == 'both' || github.event.inputs.mode == '')) ||
      (github.event_name == 'pull_request' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Skip tip-freeze labeled PRs
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/mythos-ops/ops-guards.sh"
          # Collect candidate PR numbers (drafts INCLUDED)
          CANDS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CANDS="${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # 404 on main push is a soft skip — do not capture the error JSON.
            RUN_ID="${{ github.event.workflow_run.id }}"
            if ! CANDS=$(resolve_run_prs "$RUN_ID"); then
              echo "no pull_requests for run ${RUN_ID} (main push / 404) — soft skip"
              CANDS=""
            fi
            CANDS=$(printf '%s' "$CANDS" | tr '\n' ' ')
          else
            # schedule / dispatch: open PRs behind base (include drafts)
            CANDS=$(gh pr list --repo "${{ github.repository }}" --state open --limit 40 \
              --json number,isDraft,labels,mergeStateStatus \
              --jq '.[] | select(.mergeStateStatus=="BEHIND" or .mergeStateStatus=="DIRTY") | .number' | tr '\n' ' ' || true)
          fi
          KEEP=""
          for n in $CANDS; do
            case "$n" in
              ''|*[!0-9]*) echo "skip non-numeric token: $n"; continue ;;
            esac
            LABELS=$(gh pr view "$n" --repo "${{ github.repository }}" --json labels --jq '[.labels[].name] | join(",")')
            case ",$LABELS," in
              *,tip-freeze,*) echo "skip #$n tip-freeze"; continue ;;
            esac
            KEEP="$KEEP $n"
          done
          echo "prs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$KEEP" | xargs -n1 2>/dev/null || true
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update branch (include drafts)
        if: steps.gate.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for n in ${{ steps.gate.outputs.prs }}; do
            case "$n" in
              ''|*[!0-9]*) echo "skip non-numeric token: $n"; continue ;;
            esac
            echo "update-branch PR #$n (drafts allowed)"
            gh api -X PUT "repos/${{ github.repository }}/pulls/$n/update-branch" \
              -f expected_head_sha="$(gh pr view "$n" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)" \
              || echo "update-branch soft-fail #$n (conflict or race)"
          done

  draft-ci-comment:
    name: draft-ci-comment
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'draft-ci' || github.event.inputs.mode == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Comment-only on draft CI failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/mythos-ops/ops-guards.sh"
          # Resolve PR(s) for the failed CI run. Main push → 404 → soft skip.
          RUN_ID="${{ github.event.workflow_run.id }}"
          if [ -z "${RUN_ID:-}" ]; then
            echo "no workflow_run id — soft skip"
            exit 0
          fi
          if ! PRS=$(resolve_run_prs "$RUN_ID"); then
            echo "no pull_requests for run ${RUN_ID} (main push / 404) — soft skip"
            exit 0
          fi
          if [ -z "$(printf '%s' "$PRS" | tr -d '[:space:]')" ]; then
            exit 0
          fi
          for n in $PRS; do
            case "$n" in
              ''|*[!0-9]*) echo "skip non-numeric token: $n"; continue ;;
            esac
            DRAFT=$(gh pr view "$n" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)
            if [ "$DRAFT" != "true" ]; then
              echo "skip #$n not draft"
              continue
            fi
            # Dedupe: one sticky comment marker per head SHA
            HEAD=$(gh pr view "$n" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)
            MARKER="<!-- mythos-draft-ci:${HEAD} -->"
            EXISTING=$(gh api "repos/${{ github.repository }}/issues/$n/comments" --paginate \
              --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1 || true)
            FAIL_JOBS=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json jobs \
              --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")' || echo "unknown")
            BODY=$(printf '%s\n**Draft CI failed** on tip `%s`.\nFailed jobs: %s\nRun: %s/%s/actions/runs/%s\n\nStanding agent: one CI-FIX batch per FORGE_E2E_KEEPALIVE.md + FORGE_TIP_FREEZE.md (docs paths only — do not paste full contracts). Tip-fix window: vars.MYTHOS_TIP_FIX_WINDOW_MINUTES (default 20; may auto-drop to 10).\n' \
              "$MARKER" "$HEAD" "$FAIL_JOBS" "${{ github.server_url }}" "${{ github.repository }}" "$RUN_ID")
            if [ -n "$EXISTING" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
              echo "updated comment on #$n"
            else
              gh pr comment "$n" --repo "${{ github.repository }}" --body "$BODY"
              echo "created comment on #$n"
            fi
          done

  # Zero-intervention: after 2 consecutive CI greens on the SAME draft tip → ready-for-review.
  # NEVER auto-close drafts. Marker tracks green streak per tip SHA.
  draft-ready-on-green:
    name: draft-ready-on-green
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'draft-ci' || github.event.inputs.mode == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Mark draft ready after 2 greens on same tip (shadow / breaker aware)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYTHOS_BOT_TOKEN: ${{ secrets.MYTHOS_BOT_TOKEN }}
          MYTHOS_AUTOFIX_MODE: ${{ vars.MYTHOS_AUTOFIX_MODE }}
          MYTHOS_AUTOFIX_SHADOW_UNTIL: ${{ vars.MYTHOS_AUTOFIX_SHADOW_UNTIL }}
          MYTHOS_WAKE_CIRCUIT_BREAKER: ${{ vars.MYTHOS_WAKE_CIRCUIT_BREAKER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/mythos-ops/ops-guards.sh"
          MODE="${MYTHOS_AUTOFIX_MODE:-shadow}"
          UNTIL="${MYTHOS_AUTOFIX_SHADOW_UNTIL:-}"
          BREAKER="${MYTHOS_WAKE_CIRCUIT_BREAKER:-}"
          NOW_MS=$(($(date +%s) * 1000))
          EXECUTE=1
          if [ "$MODE" = "disabled" ]; then
            EXECUTE=0
            echo "autofix disabled — log-only for ready-for-review"
          elif [ "$MODE" = "shadow" ]; then
            if [ -z "$UNTIL" ]; then
              EXECUTE=0
              echo "shadow (UNTIL unset) — log-only"
            else
              UNTIL_MS=$(date -d "$UNTIL" +%s 2>/dev/null || date -u -d "$UNTIL" +%s 2>/dev/null || echo 0)
              UNTIL_MS=$((UNTIL_MS * 1000))
              if [ "$UNTIL_MS" -gt 0 ] && [ "$NOW_MS" -lt "$UNTIL_MS" ]; then
                EXECUTE=0
                echo "shadow until $UNTIL — log-only"
              else
                echo "shadow window elapsed — treat as live for this job (weekly audit flips var)"
              fi
            fi
          fi
          BREAKER_ON=0
          if [ -n "$BREAKER" ]; then
            B_MS=$(date -d "$BREAKER" +%s 2>/dev/null || date -u -d "$BREAKER" +%s 2>/dev/null || echo 0)
            B_MS=$((B_MS * 1000))
            if [ "$B_MS" -gt "$NOW_MS" ]; then
              BREAKER_ON=1
              echo "circuit breaker active until $BREAKER — suppress auto ready-for-review"
            fi
          fi

          RUN_ID="${{ github.event.workflow_run.id }}"
          if [ -z "${RUN_ID:-}" ]; then
            echo "no workflow_run id — soft skip"
            exit 0
          fi
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          # Main-push CI success has no PRs (HTTP 404). Soft skip — do not word-split the error JSON.
          if ! PRS=$(resolve_run_prs "$RUN_ID"); then
            echo "no pull_requests for run ${RUN_ID} (main push / 404) — soft skip"
            exit 0
          fi
          if [ -z "$(printf '%s' "$PRS" | tr -d '[:space:]')" ]; then
            exit 0
          fi
          for n in $PRS; do
            case "$n" in
              ''|*[!0-9]*) echo "skip non-numeric token: $n"; continue ;;
            esac
            META=$(gh pr view "$n" --repo "${{ github.repository }}" --json isDraft,headRefOid,labels \
              --jq '{draft:.isDraft,sha:.headRefOid,labels:[.labels[].name]}')
            DRAFT=$(jq -r '.draft' <<<"$META")
            SHA=$(jq -r '.sha' <<<"$META")
            if [ "$DRAFT" != "true" ]; then
              echo "skip #$n not draft"
              continue
            fi
            if [ -n "$HEAD_SHA" ] && [ "$SHA" != "$HEAD_SHA" ]; then
              echo "skip #$n tip moved"
              continue
            fi
            case ",$(jq -r '.labels | join(",")' <<<"$META")," in
              *,tip-freeze,*) echo "skip #$n tip-freeze"; continue ;;
            esac
            MARKER="<!-- mythos-draft-green:${SHA} -->"
            EXISTING=$(gh api "repos/${{ github.repository }}/issues/$n/comments" --paginate \
              --jq ".[] | select(.body | contains(\"mythos-draft-green\")) | {id,body}" | jq -s '.[0] // empty' || true)
            streak=1
            if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
              body=$(jq -r '.body // empty' <<<"$EXISTING")
              cid=$(jq -r '.id // empty' <<<"$EXISTING")
              if echo "$body" | grep -q "$MARKER"; then
                prev=$(echo "$body" | sed -n 's/.*<!-- green_streak=\([0-9]*\) -->.*/\1/p' | head -1)
                streak=$(( ${prev:-1} + 1 ))
              else
                streak=1
              fi
              NEW=$(printf '%s\n<!-- green_streak=%s -->\nDraft CI green streak **%s** on tip `%s`.\n' "$MARKER" "$streak" "$streak" "$SHA")
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$cid" -f body="$NEW" >/dev/null
            else
              NEW=$(printf '%s\n<!-- green_streak=1 -->\nDraft CI green streak **1** on tip `%s`.\n' "$MARKER" "$SHA")
              gh pr comment "$n" --repo "${{ github.repository }}" --body "$NEW"
            fi
            if [ "$streak" -lt 2 ]; then
              continue
            fi
            if [ "$BREAKER_ON" -eq 1 ]; then
              SUP=$(printf '%s\n%s\n' \
                '<!-- mythos-draft-ready-suppressed -->' \
                "Auto ready-for-review suppressed by circuit breaker (streak=$streak tip \`${SHA}\`). See docs/MYTHOS_AUTOFIX.md.")
              gh pr comment "$n" --repo "${{ github.repository }}" --body "$SUP"
              continue
            fi
            if [ "$EXECUTE" -eq 0 ]; then
              SH=$(printf '%s\n%s\n' \
                '<!-- mythos-draft-ready-shadow -->' \
                "Shadow mode: would mark PR ready (green streak=$streak on tip \`${SHA}\`). Not executed. See docs/MYTHOS_AUTOFIX.md.")
              gh pr comment "$n" --repo "${{ github.repository }}" --body "$SH"
              echo "SHADOW would gh pr ready #$n"
              continue
            fi
            echo "escalate #$n draft→ready (green streak=$streak on same tip)"
            gh pr ready "$n" --repo "${{ github.repository }}" || echo "gh pr ready soft-fail #$n"
            ESC=$(printf '%s\n%s\n%s\n%s\n' \
              '<!-- mythos-draft-ready-escalate -->' \
              '## Auto-escalation: draft → ready-for-review' \
              "Two consecutive CI greens on tip \`${SHA}\`. Marked ready (never auto-close)." \
              'See docs/ops/ZERO_INTERVENTION_SILENCE_FIXES.md · docs/MYTHOS_AUTOFIX.md.')
            gh pr comment "$n" --repo "${{ github.repository }}" --body "$ESC"
          done
