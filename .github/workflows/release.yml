name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0-beta.2)'
        required: true
      is-beta:
        description: 'Mark as beta pre-release'
        type: boolean
        default: false

env:
  MYTHOS_AUTO_UPDATE: '1'

jobs:
  determine-release:
    runs-on: ubuntu-latest
    outputs:
      is-beta: ${{ steps.check.outputs.is-beta }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Determine release type
        id: check
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref }}"
            TAG="${TAG#refs/tags/}"
          fi
          # Normalize: strip optional leading v/V, then always prepend lowercase v
          # so dispatch with "0.5.3", "v0.5.3", or "V0.5.3" all become "v0.5.3".
          TAG="${TAG#[vV]}"
          TAG="v${TAG}"
          if [[ "$TAG" =~ ^v.*-beta ]] || [ "${{ inputs.is-beta }}" = "true" ]; then
            echo "is-beta=true" >> $GITHUB_OUTPUT
          else
            echo "is-beta=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

  # Guard: the release tag must match the version already committed to
  # package.json. This workflow never pushes a version bump itself (SKY-10762 —
  # branch protection rejects workflow-token pushes to main with GH006); the
  # bump lands first via a normal reviewed PR, then this workflow is dispatched
  # with the matching tag (or the tag is pushed). A mismatch here means the
  # bump PR hasn't merged yet — fail fast before creating the tag or release,
  # otherwise the installer ships with the wrong embedded version and the
  # updater feed breaks.
  validate-version:
    needs: determine-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches package.json version
        run: |
          TAG="${{ needs.determine-release.outputs.version }}"
          PKG_VERSION=$(jq -r '.version' package.json)
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version v$PKG_VERSION on the checked-out commit. Merge a version-bump PR to main first (see docs/releases/RELEASING.md), then re-run."
            exit 1
          fi
          echo "package.json version v$PKG_VERSION matches $TAG"

  # Create the draft release so build jobs can upload directly to it.
  # Uses softprops/action-gh-release which handles create-or-update idempotently.
  create-release:
    needs: [determine-release, validate-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create or update draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.determine-release.outputs.version }}
          draft: true
          prerelease: ${{ needs.determine-release.outputs.is-beta == 'true' }}
          body: "Release build in progress…"

  # Windows build — native on hosted windows-latest (electron-builder bundles its
  # own NSIS on Windows; no wine cross-compile needed since the repo went public).
  #
  # PLAN-SIGN: the installer, app exe and (embedded) uninstaller are signed with
  # Azure Artifact Signing (electron-builder `win.azureSignOptions`) using GitHub
  # OIDC — no client secret anywhere. The signing options live ONLY in
  # electron-builder.release.json5 (loaded by this job via --config); the shared
  # electron-builder.json that ci.yml and the local npm scripts use has none, so
  # every other packaging path stays unsigned with no Azure login.
  # Step order is load-bearing (plan §Design):
  #   checkout github.sha → gate → module pin → npm ci (no cache) → electron-vite
  #   build → azure/login → electron-builder → S-1 module check → verify → hash →
  #   az logout (always) → upload.
  # `environment: release-signing` carries the env-scoped federated credential and
  # the required reviewer; `id-token: write` lives on this job only.
  build-windows:
    needs: [determine-release, create-release]
    runs-on: windows-latest
    # Bounds the live-Azure-session window: without a credential, Invoke-TrustedSigning falls
    # through to an interactive browser login and hangs (seen in the PLAN-SIGN A3 proof run).
    timeout-minutes: 45
    environment: release-signing
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: bash

    steps:
      # Build exactly the commit the workflow was triggered for (signed ref = gated ref).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Gate (runs before any Azure step):
      #  1. The triggering ref must be a tag (a branch named like a tag is not a release tag).
      #  2. workflow_dispatch must be run ON the tag ref itself with the exact `v*` tag.
      #  3. The commit must already be on origin/main — nothing off-main gets signed.
      # Inputs are passed through env, never interpolated into the script.
      - name: Gate — dispatch ref equality and on-main check
        env:
          EVENT: ${{ github.event_name }}
          IN_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::release builds must run on a tag ref; got ref_type '$REF_TYPE' for '$REF_NAME'."
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_TAG" != "$REF_NAME" ]; then
            echo "::error::workflow_dispatch must run on the tag ref itself: inputs.tag '$IN_TAG' != github.ref_name '$REF_NAME'."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main; refusing to sign an off-main commit."
            exit 1
          fi
          echo "Gate OK: event=$EVENT ref=$REF_NAME sha=$GITHUB_SHA is on origin/main."

      # Pin the PowerShell signing module electron-builder shells out to. pwsh here
      # on purpose: electron-builder prefers pwsh.exe when present, so the pin must
      # land in the same CurrentUser module path it will autoload from.
      - name: Pin TrustedSigning PowerShell module to 0.5.8
        shell: pwsh
        env:
          PIN_VERSION: '0.5.8'
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module TrustedSigning -RequiredVersion $env:PIN_VERSION -Scope CurrentUser -Force
          $versions = @(Get-Module -ListAvailable TrustedSigning | ForEach-Object { $_.Version.ToString() })
          Write-Host "TrustedSigning versions available after pin: [$($versions -join ', ')]"
          if ($versions -notcontains $env:PIN_VERSION) {
            throw "TrustedSigning $env:PIN_VERSION is not installed (found: [$($versions -join ', ')])."
          }

      # Shield S-2: with PSGallery gone, electron-builder's own
      # `Install-Module TrustedSigning -MinimumVersion 0.5.0 -Force` cannot pull a newer module.
      - name: Unregister PSGallery (Shield S-2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Unregister-PSRepository PSGallery
          Write-Host "Registered PSRepositories after unregister: [$((Get-PSRepository | ForEach-Object Name) -join ', ')]"

      # No npm cache on this job: nothing restored from a shared cache runs while the
      # Azure session is live (Shield 2).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build app bundles (electron-vite)
        run: npx electron-vite build

      # OIDC login scoped by the `release-signing` environment. No `creds`, no secret.
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `--config electron-builder.release.json5` is the only place signing is switched on.
      - name: Build Windows artifacts — stable channel (NSIS + ZIP)
        if: needs.determine-release.outputs.is-beta == 'false'
        run: npx electron-builder --win --publish never --config electron-builder.release.json5
        env:
          # electron-builder requires AZURE_CLIENT_SECRET even for OIDC (electron-builder #9623, #8803).
          # Literal, obviously fake, NOT a secret. FOLLOWUP: drop when upstream fixes #9623.
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: not-a-secret-oidc-placeholder

      - name: Build Windows artifacts — beta channel (NSIS + ZIP)
        if: needs.determine-release.outputs.is-beta == 'true'
        # releaseType=prerelease: bakes correct value into app-update.yml so the updater
        # searches GitHub pre-releases (where beta cuts land) via the beta.yml feed.
        run: npx electron-builder --win --publish never --config electron-builder.release.json5 --config.publish.channel=beta --config.publish.releaseType=prerelease
        env:
          # electron-builder requires AZURE_CLIENT_SECRET even for OIDC (electron-builder #9623, #8803).
          # Literal, obviously fake, NOT a secret. FOLLOWUP: drop when upstream fixes #9623.
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: not-a-secret-oidc-placeholder

      # Shield S-1: exactly one TrustedSigning module version may exist after the build,
      # and it must be the pinned 0.5.8 — otherwise a different module ran during signing.
      - name: Check TrustedSigning module is exactly 0.5.8 (Shield S-1)
        shell: pwsh
        env:
          PIN_VERSION: '0.5.8'
        run: |
          $ErrorActionPreference = 'Stop'
          $versions = @(Get-Module -ListAvailable TrustedSigning | ForEach-Object { $_.Version.ToString() })
          Write-Host "TrustedSigning versions available after build: [$($versions -join ', ')]"
          if ($versions.Count -ne 1 -or $versions[0] -ne $env:PIN_VERSION) {
            throw "Expected exactly one TrustedSigning module version, $env:PIN_VERSION; found [$($versions -join ', ')]. A different module may have run while the Azure session was live — STOP and re-plan (PLAN-SIGN)."
          }

      # Fail closed: every installer exe plus the unpacked app exe must carry a Valid
      # Authenticode signature from exactly the expected publisher CN with an RFC3161
      # timestamp. The NSIS uninstaller is embedded in the installer (checked by the
      # post-merge Probe install row).
      - name: Verify Authenticode signatures
        shell: pwsh
        env:
          DIST_DIR: dist-electron
          EXPECTED_CN: SKY HIGH INFINITE TECHWORK LLC
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -Path (Join-Path $env:DIST_DIR '*.exe') -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $appExe = Join-Path $env:DIST_DIR 'win-unpacked' 'Mythos Writer.exe'
          if ($installers.Count -eq 0) { throw "No installer .exe found in '$env:DIST_DIR'." }
          if (-not (Test-Path -LiteralPath $appExe -PathType Leaf)) { throw "Missing app executable '$appExe'." }
          $failures = 0
          foreach ($file in ($installers + $appExe)) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            $cn = if ($null -ne $sig.SignerCertificate) { $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '<none>' }
            $ts = if ($null -ne $sig.TimeStamperCertificate) { $sig.TimeStamperCertificate.Subject } else { '<none>' }
            Write-Host "$file"
            Write-Host "  Status:      $($sig.Status)"
            Write-Host "  Signer CN:   $cn"
            Write-Host "  Timestamper: $ts"
            if ($sig.Status -ne 'Valid') { Write-Host "::error::$file - signature status is '$($sig.Status)', expected 'Valid'."; $failures++ }
            if ($cn -ne $env:EXPECTED_CN) { Write-Host "::error::$file - signer CN '$cn' is not exactly '$env:EXPECTED_CN'."; $failures++ }
            if ($null -eq $sig.TimeStamperCertificate) { Write-Host "::error::$file - no RFC3161 timestamp countersignature."; $failures++ }
          }
          if ($failures -gt 0) { throw "$failures signature check(s) failed." }
          Write-Host "OK: $($installers.Count + 1) executable(s) signed by '$env:EXPECTED_CN' with timestamps."

      # The updater feed must describe the exact bytes we upload: every `files[].url`
      # ending in .exe, and the top-level `path`, must sha512-match a local file.
      # electron-builder writes GitHub-safe names (spaces -> '-') into the yml, so
      # local files are matched on that same transform.
      - name: Check installer sha512 against the updater yml
        shell: pwsh
        env:
          DIST_DIR: dist-electron
          CHANNEL_YML: ${{ needs.determine-release.outputs.is-beta == 'true' && 'beta.yml' || 'latest.yml' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ymlPath = Join-Path $env:DIST_DIR $env:CHANNEL_YML
          if (-not (Test-Path -LiteralPath $ymlPath -PathType Leaf)) { throw "Missing updater feed '$ymlPath'." }
          Write-Host "---- $ymlPath ----"
          Get-Content -LiteralPath $ymlPath | ForEach-Object { Write-Host $_ }
          Write-Host "-------------------"
          $entries = @()
          $current = $null
          $topPath = $null
          $topSha = $null
          foreach ($line in Get-Content -LiteralPath $ymlPath) {
            if ($line -match '^\s+-\s+url:\s*(.+?)\s*$') { $current = @{ url = $Matches[1].Trim("'", '"'); sha512 = $null }; $entries += $current; continue }
            if ($null -ne $current -and $line -match '^\s+sha512:\s*(.+?)\s*$') { $current.sha512 = $Matches[1].Trim("'", '"'); continue }
            if ($line -match '^path:\s*(.+?)\s*$') { $topPath = $Matches[1].Trim("'", '"'); continue }
            if ($line -match '^sha512:\s*(.+?)\s*$') { $topSha = $Matches[1].Trim("'", '"'); continue }
          }
          $checks = @($entries | Where-Object { $_.url -like '*.exe' } | ForEach-Object { @{ name = $_.url; sha512 = $_.sha512 } })
          if ($null -eq $topPath -or $null -eq $topSha) { throw "Updater feed has no top-level path/sha512." }
          $checks += @{ name = $topPath; sha512 = $topSha }
          if (@($checks | Where-Object { $_.name -like '*.exe' }).Count -eq 0) { throw "Updater feed lists no .exe entries." }
          $local = @{}
          foreach ($f in Get-ChildItem -LiteralPath $env:DIST_DIR -File) {
            foreach ($key in @($f.Name, ($f.Name -replace ' ', '-'))) {
              if ($local.ContainsKey($key) -and $local[$key] -ne $f.FullName) { throw "Ambiguous local match for '$key'." }
              $local[$key] = $f.FullName
            }
          }
          $sha = [System.Security.Cryptography.SHA512]::Create()
          $failures = 0
          foreach ($c in $checks) {
            $name = [System.Uri]::UnescapeDataString($c.name)
            if (-not $local.ContainsKey($name)) { Write-Host "::error::'$name' is listed in $env:CHANNEL_YML but no such file exists in '$env:DIST_DIR'."; $failures++; continue }
            if ([string]::IsNullOrWhiteSpace($c.sha512)) { Write-Host "::error::'$name' has no sha512 in $env:CHANNEL_YML."; $failures++; continue }
            $stream = [System.IO.File]::OpenRead($local[$name])
            try { $actual = [Convert]::ToBase64String($sha.ComputeHash($stream)) } finally { $stream.Dispose() }
            if ($actual -eq $c.sha512) { Write-Host "OK   $name sha512 matches." }
            else { Write-Host "::error::sha512 mismatch for '$name': yml=$($c.sha512) actual=$actual"; $failures++ }
          }
          if ($failures -gt 0) { throw "$failures updater-feed hash check(s) failed." }
          Write-Host "OK: $($checks.Count) sha512 entr(y/ies) in $env:CHANNEL_YML match the built files."

      # Keep the Azure session as short as possible; runs even when an earlier step failed.
      - name: Azure logout
        if: always()
        run: |
          az logout || echo "az logout: no active account"
          az account clear

      - name: Upload Windows artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-release.outputs.version }}
        run: |
          gh release upload "$TAG" dist-electron/*.exe dist-electron/*.zip dist-electron/*.yml --clobber

  # macOS build — optional; not a dependency of publish-release.
  # DISABLED 2026-07-14 (Skyy): Actions budget is reserved for releases the owner can
  # actually install; macOS is a deferred platform (no Mac) and macos-latest bills at
  # 10x Linux. The old "will be skipped when minutes are exhausted" assumption stopped
  # holding once the budget was topped up — it would now really run and really bill.
  # To re-enable when macOS ships, delete the `if: false` line below.
  build-mac:
    if: false
    needs: [determine-release, create-release]
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python setuptools (node-gyp needs distutils, removed in Python 3.12+)
        run: pip3 install setuptools --break-system-packages

      - name: Install dependencies
        run: npm ci

      - name: Import Apple Developer ID certificate
        # Secret-gated: activates automatically when APPLE_CERT_P12_BASE64 is set.
        # Board action MYT-642 provisions the secret; no code change required then.
        # When absent the step logs clearly and the build continues unsigned.
        shell: bash
        run: |
          if [ -z "$APPLE_CERT_P12_BASE64" ]; then
            echo "APPLE_CERT_P12_BASE64 not set — building unsigned DMG (Gatekeeper warning expected)."
            echo "Add Apple Developer ID secrets (see MYT-642) to enable signing + notarization."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN_PATH"
          echo "APPLE_CERT_IMPORTED=1" >> "$GITHUB_ENV"
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}

      - name: Build macOS artifacts (DMG + ZIP)
        shell: bash
        run: |
          # Use Developer ID identity from keychain when cert was imported;
          # otherwise fall back to ad-hoc signing (unsigned DMG, Gatekeeper warning).
          if [ "${APPLE_CERT_IMPORTED:-}" = "1" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ "${{ needs.determine-release.outputs.is-beta }}" = "true" ]; then
            # releaseType=prerelease: bakes correct value into app-update.yml so the updater
            # searches GitHub pre-releases (where beta cuts land) via the beta-mac.yml feed.
            npx electron-vite build && npx electron-builder --mac dmg zip --publish never --config.publish.channel=beta --config.publish.releaseType=prerelease
          else
            npx electron-vite build && npx electron-builder --mac dmg zip --publish never
          fi
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Upload macOS artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-release.outputs.version }}
        run: |
          gh release upload "$TAG" dist-electron/*.dmg dist-electron/*.zip dist-electron/*.yml --clobber

  build-linux:
    needs: [determine-release, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage — stable channel
        # Clear LD_LIBRARY_PATH so the runner's inherited Paperclip embedded-postgres lib path
        # does not shadow the system liblzma.so.5 and break xz/tar during AppImage packaging.
        if: needs.determine-release.outputs.is-beta == 'false'
        env:
          LD_LIBRARY_PATH: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx electron-vite build && npx electron-builder --linux AppImage --publish never

      - name: Build Linux AppImage — beta channel
        if: needs.determine-release.outputs.is-beta == 'true'
        # releaseType=prerelease: bakes correct value into app-update.yml so the updater
        # searches GitHub pre-releases (where beta cuts land) via the beta-linux.yml feed.
        env:
          LD_LIBRARY_PATH: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx electron-vite build && npx electron-builder --linux AppImage --publish never --config.publish.channel=beta --config.publish.releaseType=prerelease

      - name: Upload Linux artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-release.outputs.version }}
        run: |
          gh release upload "$TAG" dist-electron/*.AppImage dist-electron/*.yml --clobber

  publish-release:
    needs: [determine-release, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: changelog
        run: |
          TAG="${{ needs.determine-release.outputs.version }}"
          PREV_TAG=$(git tag -l --sort=-version:refname --merged HEAD "v*" | grep -v "$TAG" | head -1 || echo "")

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --format="- %h %s" | head -50)
          else
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --oneline --format="- %h %s")
          fi

          # Defensively truncate body to ~120k chars to avoid GitHub's ~125k limit.
          # If truncated, append "…and N more" instead of failing the release.
          MAX_CHARS=122880
          BODY_LENGTH=${#CHANGELOG}
          if [ $BODY_LENGTH -gt $MAX_CHARS ]; then
            # Count how many commits we're truncating
            TOTAL_COMMITS=$(echo "$CHANGELOG" | wc -l)
            TRUNCATED=$(echo "$CHANGELOG" | head -c $MAX_CHARS)
            REMAINING=$((TOTAL_COMMITS - $(echo "$TRUNCATED" | wc -l)))
            CHANGELOG="${TRUNCATED}"$'\n'"…and $REMAINING more commits"
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release with notes (keep as draft)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-release.outputs.version }}
        run: |
          gh release edit "$TAG" --notes "${{ steps.changelog.outputs.notes }}" --draft
