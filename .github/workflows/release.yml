name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0-beta.2)'
        required: true
      is-beta:
        description: 'Mark as beta pre-release'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MYTHOS_AUTO_UPDATE: '1'

jobs:
  determine-release:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      is-beta: ${{ steps.check.outputs.is-beta }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Determine release type
        id: check
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref }}"
            TAG="${TAG#refs/tags/}"
          fi
          # Normalize: strip optional leading v/V, then always prepend lowercase v
          # so dispatch with "0.5.3", "v0.5.3", or "V0.5.3" all become "v0.5.3".
          TAG="${TAG#[vV]}"
          TAG="v${TAG}"
          if [[ "$TAG" =~ ^v.*-beta ]] || [ "${{ inputs.is-beta }}" = "true" ]; then
            echo "is-beta=true" >> $GITHUB_OUTPUT
          else
            echo "is-beta=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

  # Guard: the release tag must match the version already committed to
  # package.json. This workflow never pushes a version bump itself (SKY-10762 —
  # branch protection rejects workflow-token pushes to main with GH006); the
  # bump lands first via a normal reviewed PR, then this workflow is dispatched
  # with the matching tag (or the tag is pushed). A mismatch here means the
  # bump PR hasn't merged yet — fail fast before creating the tag or release,
  # otherwise the installer ships with the wrong embedded version and the
  # updater feed breaks.
  validate-version:
    needs: determine-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ needs.determine-release.outputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r '.version' package.json)
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version v$PKG_VERSION on the checked-out commit. Merge a version-bump PR to main first (see docs/releases/RELEASING.md), then re-run."
            exit 1
          fi
          echo "package.json version v$PKG_VERSION matches $TAG"

  # Create the draft release so later jobs can upload to it.
  # C2 refuses to touch a release that has already been published.
  create-release:
    needs: [determine-release, validate-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse to overwrite a published release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-release.outputs.version }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const { execFileSync } = require('child_process');

          function fail(message) {
            console.log(`::error::${String(message).replace(/[\r\n]/g, ' ')}`);
            process.exit(1);
          }

          function safe(value) {
            return String(value).replace(/[\r\n]/g, ' ');
          }

          const tag = process.env.TAG || '';
          if (!tag.trim() || /[\r\n]/.test(tag)) fail('TAG is empty or invalid');

          let stdout = '';
          let stderr = '';
          let status = 0;
          try {
            stdout = execFileSync('gh', ['release', 'view', tag, '--json', 'isDraft'], {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'pipe'],
            });
          } catch (err) {
            status = typeof err.status === 'number' ? err.status : 1;
            stdout = err.stdout ? err.stdout.toString() : '';
            stderr = err.stderr ? err.stderr.toString() : '';
          }

          if (status !== 0) {
            if (/release not found/i.test(stdout) || /release not found/i.test(stderr)) {
              console.log(`No existing release for ${safe(tag)}.`);
              process.exit(0);
            }
            fail(`gh release view failed for ${safe(tag)}: ${safe(stderr || stdout)}`);
          }

          let parsed;
          try {
            parsed = JSON.parse(stdout);
          } catch (err) {
            fail('gh release view returned unparsable JSON');
          }
          if (!parsed || (parsed.isDraft !== true && parsed.isDraft !== false)) {
            fail('gh release view JSON has no boolean isDraft');
          }
          if (parsed.isDraft === false) {
            fail(`Release ${safe(tag)} exists and is not a draft; refusing to overwrite a published release`);
          }
          console.log(`Existing release ${safe(tag)} is a draft.`);
          EOF
      - name: Create or update draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.determine-release.outputs.version }}
          draft: true
          make_latest: false
          prerelease: ${{ needs.determine-release.outputs.is-beta == 'true' }}
          body: "Release build in progress…"

  # Windows build. Unsigned: legacy certificate secrets are removed, and this
  # job cannot upload a release. It copies (does not rename) each installer to
  # the dashed url/path name in the channel yml and hashes that name. A space
  # or a GitHub space-to-dot name fails, so the upload name is stored unchanged.
  # needs create-release so upload-windows cannot start before the draft exists.
  build-windows:
    needs: [determine-release, create-release]
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      win-manifest: ${{ steps.win-manifest.outputs.win-manifest }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts — stable channel (NSIS + ZIP)
        if: needs.determine-release.outputs.is-beta == 'false'
        run: npx electron-vite build && npx electron-builder --win --publish never

      - name: Build Windows artifacts — beta channel (NSIS + ZIP)
        if: needs.determine-release.outputs.is-beta == 'true'
        # releaseType=prerelease: bakes correct value into app-update.yml so the updater
        # searches GitHub pre-releases (where beta cuts land) via the beta.yml feed.
        run: npx electron-vite build && npx electron-builder --win --publish never --config.publish.channel=beta --config.publish.releaseType=prerelease

      - name: Hash Windows release files
        id: win-manifest
        run: |
          set -euo pipefail
          node <<'EOF'
          function parseChannelYml(text) {
            if (typeof text !== 'string' || text.trim() === '') throw new Error('unparsable');
            const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
            let i = 0;

            function unquote(raw) {
              if (raw.length >= 2 && raw.startsWith('"') && raw.endsWith('"')) return JSON.parse(raw);
              if (raw.length >= 2 && raw.startsWith("'") && raw.endsWith("'")) {
                return raw.slice(1, -1).replace(/''/g, "'");
              }
              if (/^-?(0|[1-9]\d*)$/.test(raw)) return Number(raw);
              return raw;
            }

            function indentOf(line) {
              let n = 0;
              while (line[n] === ' ') n += 1;
              if (line[n] === '\t') throw new Error('unparsable');
              return n;
            }

            function skipBlanks() {
              while (i < lines.length && (lines[i].trim() === '' || /^\s*#/.test(lines[i]))) i += 1;
            }

            function readBlock(parentIndent, indicator) {
              const fold = indicator[0] === '>';
              const chomp = indicator.endsWith('-') ? 'strip' : indicator.endsWith('+') ? 'keep' : 'clip';
              const chunks = [];
              let blockIndent = -1;
              while (i < lines.length) {
                const line = lines[i];
                if (line.trim() === '') {
                  if (blockIndent === -1) {
                    i += 1;
                    continue;
                  }
                  chunks.push('');
                  i += 1;
                  continue;
                }
                const ind = indentOf(line);
                if (ind <= parentIndent) break;
                if (blockIndent === -1) blockIndent = ind;
                if (ind < blockIndent) break;
                chunks.push(line.slice(blockIndent));
                i += 1;
              }
              if (fold) {
                let out = '';
                for (let c = 0; c < chunks.length; c += 1) {
                  if (c === 0) out += chunks[c];
                  else if (chunks[c] === '' || chunks[c - 1] === '') out += '\n' + chunks[c];
                  else out += ' ' + chunks[c];
                }
                if (chomp !== 'keep') out = out.replace(/\n+$/, '');
                if (chomp === 'clip' && chunks.length > 0) out += '\n';
                if (chomp === 'keep') out += '\n';
                return out;
              }
              const joined = chunks.join('\n');
              if (chomp === 'strip') return joined;
              if (chomp === 'keep') return joined + '\n';
              return chunks.length ? joined + '\n' : joined;
            }

            function readPair(keyIndent, body) {
              const colon = body.indexOf(':');
              if (colon <= 0) throw new Error('unparsable');
              const key = body.slice(0, colon);
              if (!/^[A-Za-z0-9_]+$/.test(key)) throw new Error('unparsable');
              const rest = body.slice(colon + 1).trim();
              i += 1;
              if (rest === '>' || rest === '>-' || rest === '>+' || rest === '|' || rest === '|-' || rest === '|+') {
                return [key, readBlock(keyIndent, rest)];
              }
              if (rest !== '') return [key, unquote(rest)];
              skipBlanks();
              if (i >= lines.length) return [key, null];
              const nextIndent = indentOf(lines[i]);
              if (nextIndent <= keyIndent) return [key, null];
              const nextBody = lines[i].slice(nextIndent);
              if (nextBody.startsWith('- ')) return [key, readSeq(nextIndent)];
              return [key, readMap(nextIndent)];
            }

            function readMap(expected) {
              const obj = {};
              while (true) {
                skipBlanks();
                if (i >= lines.length) break;
                const ind = indentOf(lines[i]);
                if (ind < expected) break;
                if (ind !== expected) throw new Error('unparsable');
                const body = lines[i].slice(ind);
                if (body.startsWith('- ')) break;
                const [key, value] = readPair(ind, body);
                if (Object.prototype.hasOwnProperty.call(obj, key)) throw new Error('unparsable');
                obj[key] = value;
              }
              return obj;
            }

            function readSeq(dashIndent) {
              const arr = [];
              while (true) {
                skipBlanks();
                if (i >= lines.length) break;
                const ind = indentOf(lines[i]);
                if (ind < dashIndent) break;
                if (ind !== dashIndent) throw new Error('unparsable');
                const body = lines[i].slice(ind);
                if (!body.startsWith('- ')) break;
                const after = body.slice(2);
                const keyIndent = ind + 2;
                const [key, value] = readPair(keyIndent, after);
                const item = {};
                item[key] = value;
                while (true) {
                  skipBlanks();
                  if (i >= lines.length) break;
                  const ind2 = indentOf(lines[i]);
                  if (ind2 < keyIndent) break;
                  if (ind2 === dashIndent && lines[i].slice(ind2).startsWith('- ')) break;
                  if (ind2 !== keyIndent) throw new Error('unparsable');
                  const [k2, v2] = readPair(ind2, lines[i].slice(ind2));
                  if (Object.prototype.hasOwnProperty.call(item, k2)) throw new Error('unparsable');
                  item[k2] = v2;
                }
                arr.push(item);
              }
              return arr;
            }

            skipBlanks();
            if (i >= lines.length || indentOf(lines[i]) !== 0) throw new Error('unparsable');
            const doc = readMap(0);
            skipBlanks();
            if (i < lines.length) throw new Error('unparsable');
            if (doc == null || typeof doc !== 'object' || Array.isArray(doc)) throw new Error('unparsable');
            return doc;
          }

          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');

          function fail(message) {
            console.log(`::error::${String(message).replace(/[\r\n]/g, ' ')}`);
            process.exit(1);
          }

          function safe(value) {
            return String(value).replace(/[\r\n]/g, ' ');
          }

          function isPublishName(name) {
            if (typeof name !== 'string') return false;
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name)) return false;
            if (name.length > 255 || name.includes('..')) return false;
            if (/^(latest|beta|alpha)\.yml$/i.test(name)) return true;
            const ext = name.match(/\.(exe|zip)$/i);
            if (!ext) return false;
            const stem = name.slice(0, -ext[0].length);
            if (!stem.includes('-')) return false;
            if (/[A-Za-z]\.[A-Za-z]/.test(stem)) return false;
            return true;
          }

          function sha512(buf) {
            return crypto.createHash('sha512').update(buf).digest('base64');
          }

          const sourceDir = 'dist-electron';
          const staging = 'win-upload';
          const channelRe = /^(latest|beta|alpha)\.yml$/i;

          if (!fs.existsSync(sourceDir) || !fs.statSync(sourceDir).isDirectory()) {
            fail('dist-electron is missing');
          }

          const fileNames = fs.readdirSync(sourceDir).filter((name) => {
            return fs.statSync(path.join(sourceDir, name)).isFile();
          });
          const channels = fileNames.filter((name) => channelRe.test(name)).sort();
          if (channels.length === 0) fail('no Windows channel yml to name the release files');

          const bySha512 = new Map();
          const buffers = new Map();
          for (const name of fileNames) {
            if (channelRe.test(name)) continue;
            const buf = fs.readFileSync(path.join(sourceDir, name));
            buffers.set(name, buf);
            const digest = sha512(buf);
            const list = bySha512.get(digest) || [];
            list.push(name);
            bySha512.set(digest, list);
          }

          // Publish names are the channel yml url/path strings, copied (not renamed).
          // Those strings are the dashed names. A space, or a dot standing in for a
          // space, is not that name, so GitHub is never asked to rename the upload.
          const publish = new Map();

          function feedName(channelName, raw, label) {
            if (typeof raw !== 'string' || raw.length === 0 || /[\0\r\n]/.test(raw)) {
              fail(`${channelName} ${label} has no matching file`);
            }
            if (/\s/.test(raw)) fail(`refusing to publish a spaced name: ${safe(raw)}`);
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(raw) || raw.includes('..') || raw.length > 255) {
              fail(`refusing to publish an invalid Windows artifact name: ${safe(raw)}`);
            }
            if (/[A-Za-z]\.[A-Za-z]/.test(raw) && !/^(latest|beta|alpha)\.yml$/i.test(raw)) {
              fail(`refusing to publish a GitHub space-to-dot name: ${safe(raw)}`);
            }
            if (!isPublishName(raw)) fail(`refusing to publish an invalid Windows artifact name: ${safe(raw)}`);
            return raw;
          }

          function takeMatch(channelName, feed, digest) {
            const matches = bySha512.get(digest) || [];
            if (matches.length === 0) fail(`${channelName} url ${feed} has no matching file`);
            if (matches.length > 1) fail(`${channelName} url ${feed} matches more than one file`);
            const sourceName = matches[0];
            if (sourceName.includes(' ') && feed === sourceName.replace(/ /g, '.')) {
              fail(`refusing to publish a GitHub space-to-dot name: ${safe(feed)}`);
            }
            const existing = publish.get(feed);
            if (existing && existing.sourceName !== sourceName) {
              fail(`${channelName} url ${feed} maps to conflicting files`);
            }
            if (!existing && buffers.has(feed) && sourceName !== feed) {
              fail(`${channelName} url ${feed} would overwrite a different file`);
            }
            publish.set(feed, { sourceName, buf: buffers.get(sourceName) });
          }

          for (const channelName of channels) {
            if (!isPublishName(channelName)) fail(`refusing to publish an invalid Windows artifact name: ${safe(channelName)}`);
            let doc;
            try {
              doc = parseChannelYml(fs.readFileSync(path.join(sourceDir, channelName), 'utf8'));
            } catch (err) {
              fail(`${channelName} is unparsable`);
            }
            if (doc == null || typeof doc !== 'object' || Array.isArray(doc)) fail(`${channelName} is unparsable`);
            if (!Array.isArray(doc.files) || doc.files.length === 0) fail(`${channelName} has no file urls`);

            const seen = new Map();
            for (const file of doc.files) {
              if (file == null || typeof file !== 'object' || Array.isArray(file)) fail(`${channelName} file entry is unparsable`);
              const feed = feedName(channelName, file.url, 'url');
              if (typeof file.sha512 !== 'string' || file.sha512.trim() === '') {
                fail(`${channelName} url ${feed} has no matching file`);
              }
              const digest = file.sha512.trim();
              if (seen.has(feed) && seen.get(feed) !== digest) fail(`${channelName} url ${feed} is listed twice with different hashes`);
              seen.set(feed, digest);
              takeMatch(channelName, feed, digest);
            }

            if (Object.prototype.hasOwnProperty.call(doc, 'path')) {
              const feed = feedName(channelName, doc.path, 'path');
              if (!seen.has(feed)) fail(`${channelName} path ${feed} has no matching file`);
              if (typeof doc.sha512 === 'string' && doc.sha512.trim() !== '' && doc.sha512.trim() !== seen.get(feed)) {
                fail(`${channelName} path ${feed} does not match the url hash`);
              }
            }
          }

          for (const channelName of channels) {
            if (publish.has(channelName)) fail(`${channelName} collides with a feed file name`);
            publish.set(channelName, {
              sourceName: channelName,
              buf: fs.readFileSync(path.join(sourceDir, channelName)),
            });
          }

          const names = [...publish.keys()].sort();
          if (names.length === 0) fail('win-manifest has zero entries');

          fs.rmSync(staging, { recursive: true, force: true });
          fs.mkdirSync(staging);
          const manifest = {};
          for (const name of names) {
            if (!isPublishName(name)) fail(`refusing to publish an invalid Windows artifact name: ${safe(name)}`);
            const item = publish.get(name);
            const dest = path.join(staging, name);
            fs.writeFileSync(dest, item.buf);
            if (item.sourceName !== name) console.log(`copied ${JSON.stringify(item.sourceName)} -> ${JSON.stringify(name)}`);
            manifest[name] = crypto.createHash('sha256').update(fs.readFileSync(dest)).digest('hex');
          }

          const staged = fs.readdirSync(staging).sort();
          if (staged.length !== names.length || staged.some((name, index) => name !== names[index])) {
            fail('staged Windows upload does not match win-manifest');
          }

          if (!process.env.GITHUB_OUTPUT) fail('GITHUB_OUTPUT is unset');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `win-manifest=${JSON.stringify(manifest)}\n`);
          console.log(`win-manifest entries (${names.length}):`);
          for (const name of names) console.log(`- ${name} sha256=${manifest[name]}`);
          EOF

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-assets
          path: win-upload
          if-no-files-found: error
          compression-level: 0

  # Publishes the Windows artifact onto the draft. No checkout and no npm:
  # the only bytes it trusts are the ones whose sha256 matches win-manifest.
  upload-windows:
    needs: [determine-release, build-windows]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: U1 Download Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-assets
          path: win-artifact

      - name: U2 Recompute SHA-256 against the build manifest
        env:
          WIN_MANIFEST: ${{ needs.build-windows.outputs.win-manifest }}
          ARTIFACT_DIR: win-artifact
        run: |
          set -euo pipefail
          node <<'EOF'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');

          function fail(message) {
            console.log(`::error::${String(message).replace(/[\r\n]/g, ' ')}`);
            process.exit(1);
          }

          function validName(name) {
            if (typeof name !== 'string') return false;
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name)) return false;
            if (name.length > 255 || name.includes('..')) return false;
            if (/^(latest|beta|alpha)\.yml$/i.test(name)) return true;
            const ext = name.match(/\.(exe|zip)$/i);
            if (!ext) return false;
            const stem = name.slice(0, -ext[0].length);
            if (!stem.includes('-')) return false;
            if (/[A-Za-z]\.[A-Za-z]/.test(stem)) return false;
            return true;
          }

          function parseManifest(raw) {
            if (raw == null || String(raw).trim() === '') fail('win-manifest is empty');
            let manifest;
            try {
              manifest = JSON.parse(raw);
            } catch (err) {
              fail('win-manifest is unparsable');
            }
            if (manifest == null || typeof manifest !== 'object' || Array.isArray(manifest)) {
              fail('win-manifest is unparsable');
            }
            const entries = Object.entries(manifest);
            if (entries.length === 0) fail('win-manifest is empty');
            for (const [name, hash] of entries) {
              if (!validName(name)) fail('win-manifest has an invalid file name');
              if (typeof hash !== 'string' || !/^[0-9a-f]{64}$/.test(hash)) {
                fail(`win-manifest hash for ${name} is unparsable`);
              }
            }
            return manifest;
          }

          const manifest = parseManifest(process.env.WIN_MANIFEST);
          const dir = process.env.ARTIFACT_DIR;
          if (!dir || !fs.existsSync(dir) || !fs.statSync(dir).isDirectory()) {
            fail('Windows artifact directory is missing');
          }

          const present = new Map();
          function walk(current) {
            for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
              const full = path.join(current, entry.name);
              if (entry.isDirectory()) {
                walk(full);
                continue;
              }
              if (!entry.isFile()) continue;
              if (present.has(entry.name)) fail(`duplicate artifact file name: ${entry.name}`);
              const hash = crypto.createHash('sha256').update(fs.readFileSync(full)).digest('hex');
              present.set(entry.name, hash);
            }
          }
          walk(dir);

          const missing = [];
          const mismatch = [];
          const extra = [];
          for (const [name, hash] of Object.entries(manifest)) {
            if (!present.has(name)) missing.push(name);
            else if (present.get(name) !== hash) mismatch.push(name);
          }
          for (const name of present.keys()) {
            if (!Object.prototype.hasOwnProperty.call(manifest, name)) extra.push(name);
          }
          if (missing.length || mismatch.length || extra.length) {
            fail(`Windows artifact does not match win-manifest; missing=${missing.join(', ') || '-'}; mismatch=${mismatch.join(', ') || '-'}; extra=${extra.join(', ') || '-'}`);
          }

          const names = Object.keys(manifest).sort();
          console.log(`U2 checked ${names.length} manifest entries:`);
          for (const name of names) console.log(`- ${name} sha256=${manifest[name]}`);
          EOF

      - name: U3 Assert the release is still a draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-release.outputs.version }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const { execFileSync } = require('child_process');

          function fail(message) {
            console.log(`::error::${String(message).replace(/[\r\n]/g, ' ')}`);
            process.exit(1);
          }

          function safe(value) {
            return String(value).replace(/[\r\n]/g, ' ');
          }

          const tag = process.env.TAG || '';
          if (!tag.trim() || /[\r\n]/.test(tag)) fail('TAG is empty or invalid');

          let stdout;
          try {
            stdout = execFileSync('gh', ['release', 'view', tag, '--json', 'isDraft'], {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'pipe'],
            });
          } catch (err) {
            const stderr = err && err.stderr ? err.stderr.toString() : '';
            fail(`Refusing to upload: could not confirm release ${safe(tag)} is a draft: ${safe(stderr)}`);
          }

          let parsed;
          try {
            parsed = JSON.parse(stdout);
          } catch (err) {
            fail(`Refusing to upload: unparsable isDraft response for ${safe(tag)}`);
          }
          if (!parsed || parsed.isDraft !== true) {
            const shown = parsed ? parsed.isDraft : 'missing';
            fail(`Refusing to upload: release ${safe(tag)} is not a draft (isDraft=${safe(shown)})`);
          }
          console.log(`Release ${safe(tag)} is a draft.`);
          EOF

      - name: U4 Upload Windows artifacts to the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-release.outputs.version }}
          ARTIFACT_DIR: win-artifact
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "::error::TAG is empty"
            exit 1
          fi
          if [ -z "${ARTIFACT_DIR:-}" ] || [ ! -d "$ARTIFACT_DIR" ]; then
            echo "::error::Windows artifact directory is missing"
            exit 1
          fi
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find "$ARTIFACT_DIR" -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No Windows artifact files to upload"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  build-linux:
    needs: [determine-release, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage — stable channel
        # Clear LD_LIBRARY_PATH so the runner's inherited Paperclip embedded-postgres lib path
        # does not shadow the system liblzma.so.5 and break xz/tar during AppImage packaging.
        if: needs.determine-release.outputs.is-beta == 'false'
        env:
          LD_LIBRARY_PATH: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx electron-vite build && npx electron-builder --linux AppImage --publish never

      - name: Build Linux AppImage — beta channel
        if: needs.determine-release.outputs.is-beta == 'true'
        # releaseType=prerelease: bakes correct value into app-update.yml so the updater
        # searches GitHub pre-releases (where beta cuts land) via the beta-linux.yml feed.
        env:
          LD_LIBRARY_PATH: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx electron-vite build && npx electron-builder --linux AppImage --publish never --config.publish.channel=beta --config.publish.releaseType=prerelease

      - name: Assert the release is a draft before Linux upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-release.outputs.version }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const { execFileSync } = require('child_process');

          function fail(message) {
            console.log(`::error::${String(message).replace(/[\r\n]/g, ' ')}`);
            process.exit(1);
          }

          function safe(value) {
            return String(value).replace(/[\r\n]/g, ' ');
          }

          const tag = process.env.TAG || '';
          if (!tag.trim() || /[\r\n]/.test(tag)) fail('TAG is empty or invalid');

          let stdout;
          try {
            stdout = execFileSync('gh', ['release', 'view', tag, '--json', 'isDraft'], {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'pipe'],
            });
          } catch (err) {
            const stderr = err && err.stderr ? err.stderr.toString() : '';
            fail(`Refusing to upload Linux artifacts: could not confirm release ${safe(tag)} is a draft: ${safe(stderr)}`);
          }

          let parsed;
          try {
            parsed = JSON.parse(stdout);
          } catch (err) {
            fail(`Refusing to upload Linux artifacts: unparsable isDraft response for ${safe(tag)}`);
          }
          if (!parsed || parsed.isDraft !== true) {
            const shown = parsed ? parsed.isDraft : 'missing';
            fail(`Refusing to upload Linux artifacts: release ${safe(tag)} is not a draft (isDraft=${safe(shown)})`);
          }
          console.log(`Release ${safe(tag)} is a draft.`);
          EOF

      - name: Upload Linux artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-release.outputs.version }}
        run: |
          gh release upload "$TAG" dist-electron/*.AppImage dist-electron/*.yml --clobber

  publish-release:
    needs: [determine-release, build-windows, build-linux, upload-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        id: changelog
        env:
          TAG: ${{ needs.determine-release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "::error::TAG is empty"
            exit 1
          fi
          PREV_TAG=$(git tag -l --sort=-version:refname --merged HEAD "v*" | grep -v -F "$TAG" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --format="- %h %s" | head -50 || true)
          else
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --oneline --format="- %h %s" || true)
          fi

          # Defensively truncate body to ~120k chars to avoid GitHub's ~125k limit.
          # If truncated, append "…and N more" instead of failing the release.
          MAX_CHARS=122880
          BODY_LENGTH=${#CHANGELOG}
          if [ "$BODY_LENGTH" -gt "$MAX_CHARS" ]; then
            TOTAL_COMMITS=$(printf '%s\n' "$CHANGELOG" | wc -l)
            TRUNCATED=$(printf '%s' "$CHANGELOG" | head -c "$MAX_CHARS")
            REMAINING=$((TOTAL_COMMITS - $(printf '%s\n' "$TRUNCATED" | wc -l)))
            CHANGELOG="${TRUNCATED}"$'\n'"…and $REMAINING more commits"
          fi

          printf '%s' "$CHANGELOG" > "$RUNNER_TEMP/notes.md"

      - name: Re-verify Windows assets on the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-release.outputs.version }}
          WIN_MANIFEST: ${{ needs.build-windows.outputs.win-manifest }}
        run: |
          set -euo pipefail
          node <<'EOF'
          function parseChannelYml(text) {
            if (typeof text !== 'string' || text.trim() === '') throw new Error('unparsable');
            const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
            let i = 0;

            function unquote(raw) {
              if (raw.length >= 2 && raw.startsWith('"') && raw.endsWith('"')) return JSON.parse(raw);
              if (raw.length >= 2 && raw.startsWith("'") && raw.endsWith("'")) {
                return raw.slice(1, -1).replace(/''/g, "'");
              }
              if (/^-?(0|[1-9]\d*)$/.test(raw)) return Number(raw);
              return raw;
            }

            function indentOf(line) {
              let n = 0;
              while (line[n] === ' ') n += 1;
              if (line[n] === '\t') throw new Error('unparsable');
              return n;
            }

            function skipBlanks() {
              while (i < lines.length && (lines[i].trim() === '' || /^\s*#/.test(lines[i]))) i += 1;
            }

            function readBlock(parentIndent, indicator) {
              const fold = indicator[0] === '>';
              const chomp = indicator.endsWith('-') ? 'strip' : indicator.endsWith('+') ? 'keep' : 'clip';
              const chunks = [];
              let blockIndent = -1;
              while (i < lines.length) {
                const line = lines[i];
                if (line.trim() === '') {
                  if (blockIndent === -1) {
                    i += 1;
                    continue;
                  }
                  chunks.push('');
                  i += 1;
                  continue;
                }
                const ind = indentOf(line);
                if (ind <= parentIndent) break;
                if (blockIndent === -1) blockIndent = ind;
                if (ind < blockIndent) break;
                chunks.push(line.slice(blockIndent));
                i += 1;
              }
              if (fold) {
                let out = '';
                for (let c = 0; c < chunks.length; c += 1) {
                  if (c === 0) out += chunks[c];
                  else if (chunks[c] === '' || chunks[c - 1] === '') out += '\n' + chunks[c];
                  else out += ' ' + chunks[c];
                }
                if (chomp !== 'keep') out = out.replace(/\n+$/, '');
                if (chomp === 'clip' && chunks.length > 0) out += '\n';
                if (chomp === 'keep') out += '\n';
                return out;
              }
              const joined = chunks.join('\n');
              if (chomp === 'strip') return joined;
              if (chomp === 'keep') return joined + '\n';
              return chunks.length ? joined + '\n' : joined;
            }

            function readPair(keyIndent, body) {
              const colon = body.indexOf(':');
              if (colon <= 0) throw new Error('unparsable');
              const key = body.slice(0, colon);
              if (!/^[A-Za-z0-9_]+$/.test(key)) throw new Error('unparsable');
              const rest = body.slice(colon + 1).trim();
              i += 1;
              if (rest === '>' || rest === '>-' || rest === '>+' || rest === '|' || rest === '|-' || rest === '|+') {
                return [key, readBlock(keyIndent, rest)];
              }
              if (rest !== '') return [key, unquote(rest)];
              skipBlanks();
              if (i >= lines.length) return [key, null];
              const nextIndent = indentOf(lines[i]);
              if (nextIndent <= keyIndent) return [key, null];
              const nextBody = lines[i].slice(nextIndent);
              if (nextBody.startsWith('- ')) return [key, readSeq(nextIndent)];
              return [key, readMap(nextIndent)];
            }

            function readMap(expected) {
              const obj = {};
              while (true) {
                skipBlanks();
                if (i >= lines.length) break;
                const ind = indentOf(lines[i]);
                if (ind < expected) break;
                if (ind !== expected) throw new Error('unparsable');
                const body = lines[i].slice(ind);
                if (body.startsWith('- ')) break;
                const [key, value] = readPair(ind, body);
                if (Object.prototype.hasOwnProperty.call(obj, key)) throw new Error('unparsable');
                obj[key] = value;
              }
              return obj;
            }

            function readSeq(dashIndent) {
              const arr = [];
              while (true) {
                skipBlanks();
                if (i >= lines.length) break;
                const ind = indentOf(lines[i]);
                if (ind < dashIndent) break;
                if (ind !== dashIndent) throw new Error('unparsable');
                const body = lines[i].slice(ind);
                if (!body.startsWith('- ')) break;
                const after = body.slice(2);
                const keyIndent = ind + 2;
                const [key, value] = readPair(keyIndent, after);
                const item = {};
                item[key] = value;
                while (true) {
                  skipBlanks();
                  if (i >= lines.length) break;
                  const ind2 = indentOf(lines[i]);
                  if (ind2 < keyIndent) break;
                  if (ind2 === dashIndent && lines[i].slice(ind2).startsWith('- ')) break;
                  if (ind2 !== keyIndent) throw new Error('unparsable');
                  const [k2, v2] = readPair(ind2, lines[i].slice(ind2));
                  if (Object.prototype.hasOwnProperty.call(item, k2)) throw new Error('unparsable');
                  item[k2] = v2;
                }
                arr.push(item);
              }
              return arr;
            }

            skipBlanks();
            if (i >= lines.length || indentOf(lines[i]) !== 0) throw new Error('unparsable');
            const doc = readMap(0);
            skipBlanks();
            if (i < lines.length) throw new Error('unparsable');
            if (doc == null || typeof doc !== 'object' || Array.isArray(doc)) throw new Error('unparsable');
            return doc;
          }

          const crypto = require('crypto');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { execFileSync } = require('child_process');

          function fail(message) {
            console.log(`::error::${String(message).replace(/[\r\n]/g, ' ')}`);
            process.exit(1);
          }

          function safe(value) {
            return String(value).replace(/[\r\n]/g, ' ');
          }

          function isPublishName(name) {
            if (typeof name !== 'string') return false;
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name)) return false;
            if (name.length > 255 || name.includes('..')) return false;
            if (/^(latest|beta|alpha)\.yml$/i.test(name)) return true;
            const ext = name.match(/\.(exe|zip)$/i);
            if (!ext) return false;
            const stem = name.slice(0, -ext[0].length);
            if (!stem.includes('-')) return false;
            if (/[A-Za-z]\.[A-Za-z]/.test(stem)) return false;
            return true;
          }

          function isChannelYml(name) {
            return /^(latest|beta|alpha)\.yml$/i.test(name);
          }

          function linuxAllowed(name) {
            const lower = String(name).toLowerCase();
            if (lower.endsWith('.appimage')) return true;
            if (lower === 'latest-linux.yml' || lower === 'beta-linux.yml') return true;
            return false;
          }

          function parseManifest(raw) {
            if (raw == null || String(raw).trim() === '') fail('win-manifest is empty');
            let manifest;
            try {
              manifest = JSON.parse(raw);
            } catch (err) {
              fail('win-manifest is unparsable');
            }
            if (manifest == null || typeof manifest !== 'object' || Array.isArray(manifest)) {
              fail('win-manifest is unparsable');
            }
            const entries = Object.entries(manifest);
            if (entries.length === 0) fail('win-manifest is empty');
            for (const [name, hash] of entries) {
              if (!isPublishName(name)) fail('win-manifest has an invalid file name');
              if (typeof hash !== 'string' || !/^[0-9a-f]{64}$/.test(hash)) {
                fail(`win-manifest hash for ${name} is unparsable`);
              }
            }
            return manifest;
          }

          function gh(args) {
            try {
              return execFileSync('gh', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
            } catch (err) {
              const stderr = err && err.stderr ? err.stderr.toString() : '';
              const stdout = err && err.stdout ? err.stdout.toString() : '';
              fail(`gh ${args.map(safe).join(' ')} failed: ${safe(stderr || stdout || err.message)}`);
            }
          }

          const tag = process.env.TAG || '';
          if (!tag.trim() || /[\r\n]/.test(tag)) fail('TAG is empty or invalid');

          const manifest = parseManifest(process.env.WIN_MANIFEST);
          const view = gh(['release', 'view', tag, '--json', 'assets']);
          let assets;
          try {
            assets = JSON.parse(view).assets;
          } catch (err) {
            fail('release asset list is unparsable');
          }
          if (!Array.isArray(assets)) fail('release asset list is unparsable');

          const assetNames = [];
          for (const asset of assets) {
            if (!asset || typeof asset.name !== 'string' || asset.name.length === 0 || /[\0\r\n]/.test(asset.name)) {
              fail('release asset list has an invalid file name');
            }
            assetNames.push(asset.name);
          }
          const assetSet = new Set(assetNames);
          if (assetSet.size !== assetNames.length) fail('release asset list has a duplicate name');

          const missing = [];
          const mismatch = [];
          const downloadedFiles = new Map();

          for (const [name, expected] of Object.entries(manifest)) {
            if (!assetSet.has(name)) {
              missing.push(name);
              continue;
            }
            const dest = fs.mkdtempSync(path.join(os.tmpdir(), 'p3-'));
            gh(['release', 'download', tag, '--dir', dest, '--clobber', '--pattern', name]);
            const downloaded = fs.readdirSync(dest).filter((entry) => fs.statSync(path.join(dest, entry)).isFile());
            if (downloaded.length !== 1 || downloaded[0] !== name) {
              fail(`download for ${safe(name)} did not return that file`);
            }
            const full = path.join(dest, name);
            const hash = crypto.createHash('sha256').update(fs.readFileSync(full)).digest('hex');
            if (hash !== expected) mismatch.push(name);
            downloadedFiles.set(name, full);
          }

          const feedNames = new Set();
          for (const [name, filePath] of downloadedFiles) {
            if (!isChannelYml(name)) continue;
            let doc;
            try {
              doc = parseChannelYml(fs.readFileSync(filePath, 'utf8'));
            } catch (err) {
              fail(`${safe(name)} is unparsable`);
            }
            if (doc == null || typeof doc !== 'object' || Array.isArray(doc)) fail(`${safe(name)} is unparsable`);
            if (!Array.isArray(doc.files) || doc.files.length === 0) fail(`${safe(name)} has no file urls`);
            for (const file of doc.files) {
              if (file == null || typeof file !== 'object' || Array.isArray(file) || typeof file.url !== 'string') {
                fail(`${safe(name)} file entry is unparsable`);
              }
              feedNames.add(file.url);
              if (!Object.prototype.hasOwnProperty.call(manifest, file.url)) {
                fail(`${safe(name)} url ${safe(file.url)} has no manifest entry`);
              }
              if (!downloadedFiles.has(file.url)) {
                fail(`${safe(name)} url ${safe(file.url)} has no downloaded file`);
              }
            }
            if (Object.prototype.hasOwnProperty.call(doc, 'path')) {
              if (typeof doc.path !== 'string') fail(`${safe(name)} path is unparsable`);
              feedNames.add(doc.path);
              if (!Object.prototype.hasOwnProperty.call(manifest, doc.path)) {
                fail(`${safe(name)} path ${safe(doc.path)} has no manifest entry`);
              }
              if (!downloadedFiles.has(doc.path)) {
                fail(`${safe(name)} path ${safe(doc.path)} has no downloaded file`);
              }
            }
          }

          for (const name of Object.keys(manifest)) {
            if (isChannelYml(name)) continue;
            if (!feedNames.has(name)) fail(`${safe(name)} is not a channel yml url`);
          }

          const denied = assetNames.filter((name) => !Object.prototype.hasOwnProperty.call(manifest, name) && !linuxAllowed(name));
          const names = Object.keys(manifest).sort();
          console.log(`P3 checked ${names.length} manifest entries:`);
          for (const name of names) console.log(`- ${name} sha256=${manifest[name]}`);

          if (denied.length || missing.length || mismatch.length) {
            fail(`draft Windows assets do not match win-manifest; missing=${missing.join(', ') || '-'}; mismatch=${mismatch.join(', ') || '-'}; extra=${denied.join(', ') || '-'}`);
          }
          EOF

      - name: Update release with notes (keep as draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "::error::TAG is empty"
            exit 1
          fi
          if [ ! -f "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::release notes file is missing"
            exit 1
          fi
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft
