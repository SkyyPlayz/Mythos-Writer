name: VR Baselines

# Regenerates the visual-regression baselines (e2e/visual-baselines/) in the
# GitHub-hosted runner environment (fonts and viewport metrics differ between
# runner images, so baselines captured on one environment fail pixelmatch on
# another). Needed whenever the UI changes intentionally (e.g. the Liquid Neon
# redesign) or the CI rendering environment changes. Also uploads the
# baselines as the `vr-baselines` artifact.
#
# Opens a PR against the branch the workflow ran on — does NOT auto-merge.
# After Mythos tip-SHA gate (#1602 / docs/MERGE_GATE.md), baseline PRs land
# only via mythos-gate-auto-merge.yml once Critic APPROVE + Shield CLEAR +
# Probe VERIFY PASS are tip-bound and required checks are green. Branch
# protection on `main` still requires checks that only run on pull_request,
# so a direct push is rejected (GH006). See SKY-8215.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          rm -rf out/
          npm run build:electron

      - name: Install Xvfb (virtual display for Electron)
        run: |
          if command -v Xvfb >/dev/null 2>&1; then
            echo "Xvfb already installed — skipping apt-get"
          else
            sudo apt-get update -q
            sudo apt-get install -y xvfb
          fi

      - name: Regenerate visual-regression baselines
        env:
          VR_UPDATE_BASELINES: '1'
        run: xvfb-run --auto-servernum npm run test:e2e:visual-regression

      - name: Upload baselines artifact
        continue-on-error: true  # storage quota may be exhausted; the commit below is the real output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vr-baselines
          path: e2e/visual-baselines/
          retention-days: 3

      - name: Commit regenerated baselines to a branch and open a PR
        env:
          # Prefer bot PAT so the opened PR's pull_request event triggers CI /
          # screenshot-check / carve-out-check (GITHUB_TOKEN events are suppressed).
          MYTHOS_BOT_TOKEN: ${{ secrets.MYTHOS_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.MYTHOS_BOT_TOKEN }}
        run: |
          if [ -z "${MYTHOS_BOT_TOKEN}" ]; then
            echo "::error::MYTHOS_BOT_TOKEN is required so VR baseline PRs receive required checks for the Mythos tip-SHA gate. GITHUB_TOKEN-created PRs do not trigger workflows."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Dispatch VR Baselines from main only (got '${GITHUB_REF_NAME}'). Mythos gate rejects non-main bases."
            exit 1
          fi

          git config user.name "vr-baselines-bot"
          git config user.email "noreply@github.com"
          git add e2e/visual-baselines/
          if git diff --cached --quiet; then
            echo "Baselines unchanged — nothing to commit."
            exit 0
          fi

          BRANCH="vr-baselines/refresh-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "test(vr): regenerate visual baselines on hosted runner"
          git push origin "HEAD:$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "test(vr): regenerate visual baselines" \
            --body "Automated visual-regression baseline refresh (workflow run ${GITHUB_RUN_ID}). Does **not** auto-merge — lands only via Mythos tip-SHA gate (Critic APPROVE + Shield CLEAR + Probe VERIFY PASS + required checks). See docs/MERGE_GATE.md."
