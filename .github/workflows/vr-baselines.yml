name: VR Baselines

# Regenerates the visual-regression baselines (e2e/visual-baselines/) in the
# GitHub-hosted runner environment (fonts and viewport metrics differ between
# runner images, so baselines captured on one environment fail pixelmatch on
# another). Needed whenever the UI changes intentionally (e.g. the Liquid Neon
# redesign) or the CI rendering environment changes. Also uploads the
# baselines as the `vr-baselines` artifact.
#
# The step that committed those baselines and opened a PR required the dead
# bot PAT. That step is removed. This workflow does not open a PR and does
# not merge. See docs/MERGE_GATE.md and SKY-8215.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          rm -rf out/
          npm run build:electron

      - name: Install Xvfb (virtual display for Electron)
        run: |
          if command -v Xvfb >/dev/null 2>&1; then
            echo "Xvfb already installed — skipping apt-get"
          else
            sudo apt-get update -q
            sudo apt-get install -y xvfb
          fi

      - name: Regenerate visual-regression baselines
        env:
          VR_UPDATE_BASELINES: '1'
        run: xvfb-run --auto-servernum npm run test:e2e:visual-regression

      - name: Upload baselines artifact
        continue-on-error: true  # storage quota may be exhausted; the artifact is the output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vr-baselines
          path: e2e/visual-baselines/
          retention-days: 3
