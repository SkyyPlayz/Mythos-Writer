name: Draft CI comment

# Sticky when CI fails on a **draft** PR + zero-intervention escalation.
# Creed: cut waste, don't weaken quality.
# No Forge / Grok Bot / agent @mentions on the sticky itself.
# Docs: docs/FORGE_E2E_KEEPALIVE.md · docs/ops/ZERO_INTERVENTION_SILENCE_FIXES.md

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: draft-ci-comment-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  comment:
    name: draft-ci-sticky
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Sticky comment + streak escalate (draft → ready)
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MARKER = '<!-- mythos-draft-ci -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;

            let pr = (run.pull_requests || [])[0] || null;
            if (!pr) {
              const q = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${run.head_branch}`, per_page: 10,
              });
              pr = (q.data || []).find((p) => p.head && p.head.sha === headSha) || q.data[0] || null;
            }
            if (!pr) {
              core.info('No open PR for failed CI run — skip');
              return;
            }

            const { data: full } = await github.rest.pulls.get({
              owner, repo, pull_number: pr.number,
            });
            if (!full.draft) {
              core.info(`PR #${pr.number} is not draft — skip`);
              return;
            }
            if (full.head.sha !== headSha) {
              core.info(`PR tip moved (${full.head.sha} ≠ ${headSha}) — skip stale run`);
              return;
            }

            const failed = await github.paginate(
              github.rest.checks.listForRef,
              { owner, repo, ref: headSha, filter: 'latest', per_page: 100 },
              (response) => (response.data.check_runs || []).filter((c) => c.conclusion === 'failure'),
            );
            const failedLines = failed.length
              ? failed.slice(0, 20).map((c) => `- \`${c.name}\``).join('\n')
              : '- _(no check-run names available — see workflow run)_';

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: full.number, per_page: 100,
            });
            const existing = (comments || []).find((c) => c.body && c.body.includes(MARKER));

            // Persist fail streak across distinct tip SHAs in HTML comment.
            let failStreak = 1;
            let lastTips = [];
            if (existing?.body) {
              const streakM = /<!--\s*fail_streak=(\d+)\s*-->/.exec(existing.body);
              const tipsM = /<!--\s*fail_tips:([^>]*)-->/.exec(existing.body);
              if (tipsM) {
                lastTips = tipsM[1].split(',').map((s) => s.trim()).filter(Boolean);
              }
              if (lastTips.includes(headSha)) {
                // Same tip already counted — SILENT (no spam, no double-count).
                core.info(`Sticky already covers tip ${headSha.slice(0, 7)} — silent`);
                return;
              }
              const prev = streakM ? Number(streakM[1]) : lastTips.length || 1;
              failStreak = (Number.isFinite(prev) ? prev : 1) + 1;
              lastTips = [...lastTips, headSha].slice(-5);
            } else {
              lastTips = [headSha];
            }

            const body = [
              MARKER,
              `<!-- tip:${headSha} -->`,
              `<!-- fail_streak=${failStreak} -->`,
              `<!-- fail_tips:${lastTips.join(',')} -->`,
              `## Draft CI failed on tip \`${headSha.slice(0, 7)}\``,
              '',
              `Fail streak (distinct tips): **${failStreak}**`,
              '',
              'Comment only on sticky — no agent @mention. See `docs/FORGE_E2E_KEEPALIVE.md`.',
              '',
              `Run: ${runUrl}`,
              '',
              '### Failed checks',
              failedLines,
              failed.length > 20 ? `\n_…and ${failed.length - 20} more_` : '',
              '',
              '### Tip-freeze reminder',
              'Inventory → **one CI-fix batch** tip. Soft cap ~20m (or `vars.MYTHOS_TIP_FREEZE_EMERGENCY_MINUTES`) — `docs/FORGE_TIP_FREEZE.md`.',
              '',
              '_Creed: cut waste, don\'t weaken quality._',
            ].filter((l) => l !== '').join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated draft-ci sticky on PR #${full.number} streak=${failStreak}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: full.number, body,
              });
              core.info(`Created draft-ci sticky on PR #${full.number}`);
            }

            // Zero-intervention: after 2 consecutive failures on different tips → ready-for-review
            // (louder GH notifications; not close).
            if (failStreak >= 2 && full.draft) {
              try {
                await github.rest.pulls.update({
                  owner, repo, pull_number: full.number, draft: false,
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: full.number,
                  body: [
                    '<!-- mythos-draft-ci-escalate -->',
                    `## Auto-escalation: draft → ready-for-review`,
                    '',
                    `Fail streak reached **${failStreak}** distinct red tips. Converting to **ready for review** so notifications are loud (zero-intervention silence fix).`,
                    '',
                    'Still apply tip-freeze batching — do not drip-fix. See `docs/ops/ZERO_INTERVENTION_SILENCE_FIXES.md`.',
                  ].join('\n'),
                });
                core.info(`Escalated PR #${full.number} draft→ready (streak=${failStreak})`);
              } catch (e) {
                core.warning(`Could not mark ready: ${e.message}`);
              }
            }
